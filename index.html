<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smokin174 | Premium Price</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-black: #050505;
            --neon-green: #2bff00;
            --neon-blue: #0088cc;
            --neon-border: rgba(43, 255, 0, 0.3);
            --glass: rgba(15, 15, 15, 0.85);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-black); color: #fff; line-height: 1.5; overflow-x: hidden; min-height: 100vh; }

        /* АНИМИРОВАННЫЙ ФОН */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .circle { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(43, 255, 0, 0.08) 0%, rgba(0,0,0,0) 70%); animation: move 25s infinite alternate ease-in-out; }
        @keyframes move { 0% { transform: translate(0, 0); } 100% { transform: translate(100px, 80px); } }

        /* ШАПКА */
        header { 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--neon-border); 
            padding: 0.6rem 0; position: sticky; top: 0; z-index: 1000; overflow: hidden;
        }
        /* Круги в шапке */
        header::before { content: ""; position: absolute; top: -50px; left: -50px; width: 150px; height: 150px; background: radial-gradient(circle, rgba(43, 255, 0, 0.1) 0%, transparent 70%); pointer-events: none; }

        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 15px; position: relative; z-index: 2; }
        .logo-block { display: flex; align-items: center; gap: 12px; }
        .main-logo { height: 42px; width: auto; }
        .price-label { font-size: 1.4rem; font-weight: 900; color: var(--neon-green); text-transform: uppercase; text-shadow: 0 0 8px var(--neon-green); }

        .nav-icons { display: flex; align-items: center; gap: 18px; }
        .nav-icons a { color: #888; transition: var(--transition); text-decoration: none; }
        .nav-icons a:hover { color: var(--neon-blue); filter: drop-shadow(0 0 8px var(--neon-blue)); }

        /* КАТЕГОРИИ */
        .cat-bar { background: rgba(0,0,0,0.3); padding: 12px 0; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #111; }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-container { display: flex; gap: 10px; padding: 0 15px; max-width: 1200px; margin: 0 auto; }
        .cat-link { padding: 8px 18px; border-radius: 20px; background: #111; border: 1px solid #222; color: #888; cursor: pointer; transition: var(--transition); font-size: 0.85rem; }
        .cat-link.active { background: var(--neon-green); color: #000; font-weight: bold; border-color: var(--neon-green); }

        /* СЕТКА ТОВАРОВ */
        .main { max-width: 1200px; margin: 15px auto; padding: 0 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } .main { padding: 0 10px; } }

        /* КАРТОЧКА */
        .card { background: var(--glass); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; display: flex; flex-direction: column; height: 100%; transition: var(--transition); position: relative; }
        .card:hover { border-color: var(--neon-green); transform: translateY(-3px); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #000; }
        .card-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-price { font-size: 1.15rem; font-weight: 800; color: var(--neon-green); }
        .btn-variants { background: rgba(43, 255, 0, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.8rem; width: 100%; margin-top: 10px; transition: var(--transition); }
        .btn-variants:hover { background: var(--neon-green); color: #000; }

        /* SKELETON LOADING ANIMATION */
        .skeleton { background: #111; position: relative; overflow: hidden; border-radius: 15px; height: 320px; }
        .skeleton::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent); animation: loading 1.5s infinite; }
        @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* МОДАЛЬНЫЕ ОКНА */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; opacity: 0; transition: opacity 0.3s ease; }
        .overlay.active { display: flex; opacity: 1; }
        .modal { background: #0a0a0a; border: 1px solid var(--neon-border); padding: 25px; border-radius: 20px; width: 92%; max-width: 400px; max-height: 85vh; display: flex; flex-direction: column; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; color: #666; cursor: pointer; }
        .modal-scroll { overflow-y: auto; margin-bottom: 15px; }
        .v-item { background: #111; padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 3px solid var(--neon-green); }

        /* АДМИНКА */
        .inp { width: 100%; background: #151515; border: 1px solid #222; color: #fff; padding: 12px; border-radius: 12px; margin-bottom: 12px; outline: none; }
        .btn-main { background: var(--neon-green); color: #000; border: none; padding: 12px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; }
        #adminVList { max-height: 120px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="bg-animation" id="bgAnim"></div>

<header>
    <div class="header-content">
        <div class="logo-block">
            <img src="logo.jpg" alt="Logo" class="main-logo" onerror="this.style.display='none'">
            <div class="price-label">Прайс</div>
        </div>
        <div class="nav-icons">
            <a href="https://t.me/smokin174" target="_blank"><i class="fab fa-telegram fa-lg"></i></a>
            <div onclick="openModal('loginOverlay')" style="cursor:pointer; opacity: 0.2;"><i class="fas fa-fingerprint fa-lg"></i></div>
        </div>
    </div>
</header>

<div class="cat-bar">
    <div class="cat-container" id="cats"></div>
</div>

<main class="main">
    <div class="grid" id="productGrid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>
    <div id="adminArea" style="display:none; text-align:center; margin-top:30px;">
        <button class="btn-main" onclick="openAdd()" style="width:auto; padding:12px 40px;">+ ДОБАВИТЬ ТОВАР</button>
    </div>
</main>

<div class="overlay" id="vOverlay" onclick="closeModal('vOverlay')">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="close-modal" onclick="closeModal('vOverlay')"><i class="fas fa-times"></i></div>
        <h2 id="vTitle" style="color:var(--neon-green); margin-bottom:15px; font-size: 1.3rem;">Вкусы</h2>
        <div id="vList" class="modal-scroll"></div>
    </div>
</div>

<div class="overlay" id="pOverlay" onclick="closeModal('pOverlay')">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="close-modal" onclick="closeModal('pOverlay')"><i class="fas fa-times"></i></div>
        <h2 id="mTitle" style="color:var(--neon-green); margin-bottom:15px;">Товар</h2>
        <form id="pForm" class="modal-scroll">
            <input type="hidden" id="pId">
            <input type="text" id="pName" placeholder="Название" class="inp" required>
            <input type="number" id="pPrice" placeholder="Цена" class="inp" required>
            <input type="text" id="pCat" placeholder="Категория" class="inp" required>
            <div style="background: #000; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #222;">
                <input type="text" id="pBtnName" placeholder="Имя кнопки (Вкусы)" class="inp">
                <div style="display:flex; gap:5px;">
                    <input type="text" id="vInp" class="inp" style="margin-bottom:0">
                    <button type="button" onclick="addV()" class="btn-main" style="width:50px;">+</button>
                </div>
                <div id="adminVList"></div>
            </div>
            <input type="file" id="fInp" class="inp">
            <input type="hidden" id="pImg">
        </form>
        <button form="pForm" type="submit" class="btn-main">СОХРАНИТЬ</button>
    </div>
</div>

<div class="overlay" id="loginOverlay" onclick="closeModal('loginOverlay')">
    <div class="modal" style="max-width:300px;" onclick="event.stopPropagation()">
        <h2 style="text-align:center; margin-bottom:15px;">Admin</h2>
        <input type="password" id="pass" class="inp" placeholder="Пароль">
        <button onclick="tryLogin()" class="btn-main">ВОЙТИ</button>
    </div>
</div>

<script>
    const bg = document.getElementById('bgAnim');
    for(let i=0; i<6; i++) {
        const c = document.createElement('div');
        c.className = 'circle';
        const size = Math.random() * 200 + 150;
        c.style.width = size + 'px'; c.style.height = size + 'px';
        c.style.left = Math.random() * 100 + '%'; c.style.top = Math.random() * 100 + '%';
        c.style.animationDuration = (Math.random() * 10 + 20) + 's';
        bg.appendChild(c);
    }

    const firebaseConfig = {
        apiKey: "AIzaSyD3wDw2ZTTXn2gY467grDOVi9E5vcusilc",
        authDomain: "alexsmok-1dc1c.firebaseapp.com",
        databaseURL: "https://alexsmok-1dc1c-default-rtdb.firebaseio.com",
        projectId: "alexsmok-1dc1c",
        appId: "1:173792761960:web:5bc84d324322edd58ac3dd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let products = [], curVariants = [], isAdmin = false, curCat = 'all';

    function load() {
        db.ref('products').on('value', snap => {
            const val = snap.val();
            products = val ? Object.keys(val).map(k => ({id:k, ...val[k]})) : [];
            render();
        });
    }

    function render() {
        const cats = ['all', ...new Set(products.map(p => p.category))];
        document.getElementById('cats').innerHTML = cats.map(c => `<div class="cat-link ${curCat === c ? 'active' : ''}" onclick="setCat('${c}')">${c === 'all' ? 'Все' : c}</div>`).join('');
        
        const filtered = curCat === 'all' ? products : products.filter(p => p.category === curCat);
        
        // Если товаров нет (загрузка или пусто), показываем скелетоны (только если массив пустой при первой загрузке)
        const grid = document.getElementById('productGrid');
        if (products.length === 0) {
            grid.innerHTML = '<div class="skeleton"></div>'.repeat(4);
            return;
        }

        grid.innerHTML = filtered.map(p => {
            const imgSource = p.imageData.startsWith('data:image') ? p.imageData : `data:image/jpeg;base64,${p.imageData}`;
            return `
                <div class="card" style="animation: fadeIn 0.5s ease">
                    ${isAdmin ? `<div style="position:absolute; top:8px; right:8px; z-index:10; display:flex; gap:5px;">
                        <button onclick="editP('${p.id}')" style="background:var(--neon-green); border:none; width:30px; height:30px; border-radius:50%; cursor:pointer;"><i class="fas fa-edit"></i></button>
                        <button onclick="delP('${p.id}')" style="background:#ff4444; color:#fff; border:none; width:30px; height:30px; border-radius:50%; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </div>` : ''}
                    <img src="${imgSource}" class="card-img" onerror="this.src='https://via.placeholder.com/300?text=No+Photo'">
                    <div class="card-info">
                        <div>
                            <span style="font-size:0.95rem; display:block; margin-bottom:4px;">${p.name}</span>
                            <div class="card-price">${p.price} ₽</div>
                        </div>
                        ${p.variants && p.variants.length > 0 ? `<button class="btn-variants" onclick="openV('${p.id}')">${p.variantButtonName || 'Вкусы'} (${p.variants.length})</button>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    // Анимация плавного появления товаров
    const style = document.createElement('style');
    style.innerHTML = `@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }`;
    document.head.appendChild(style);

    window.openModal = (id) => { const el = document.getElementById(id); el.style.display = 'flex'; setTimeout(() => el.classList.add('active'), 10); };
    window.closeModal = (id) => { const el = document.getElementById(id); el.classList.remove('active'); setTimeout(() => el.style.display = 'none', 300); };
    window.openV = (id) => { const p = products.find(x => x.id === id); document.getElementById('vTitle').textContent = p.variantButtonName || 'Вкусы'; document.getElementById('vList').innerHTML = p.variants.map(v => `<div class="v-item">${v}</div>`).join(''); openModal('vOverlay'); };
    window.setCat = (c) => { curCat = c; render(); };
    window.addV = () => { const v = document.getElementById('vInp').value.trim(); if(v) { curVariants.push(v); document.getElementById('vInp').value = ''; renderAV(); } };
    function renderAV() { document.getElementById('adminVList').innerHTML = curVariants.map((v, i) => `<span style="background:#222; padding:4px 10px; border-radius:8px; font-size:0.75rem; border:1px solid #333;">${v} <i class="fas fa-times" onclick="curVariants.splice(${i},1);renderAV()" style="color:#ff4444; margin-left:5px; cursor:pointer"></i></span>`).join(''); }

    document.getElementById('pForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            category: document.getElementById('pCat').value,
            variantButtonName: document.getElementById('pBtnName').value || 'Вкусы',
            variants: curVariants,
            imageData: document.getElementById('pImg').value,
            updatedAt: Date.now()
        };
        const id = document.getElementById('pId').value;
        id ? await db.ref('products/'+id).update(data) : await db.ref('products').push(data);
        closeModal('pOverlay');
    };

    document.getElementById('fInp').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => document.getElementById('pImg').value = ev.target.result;
        reader.readAsDataURL(e.target.files[0]);
    };

    window.editP = (id) => {
        const p = products.find(x => x.id === id);
        document.getElementById('pId').value = p.id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pCat').value = p.category;
        document.getElementById('pBtnName').value = p.variantButtonName || '';
        document.getElementById('pImg').value = p.imageData;
        curVariants = p.variants ? [...p.variants] : [];
        renderAV(); openModal('pOverlay');
    };

    window.delP = (id) => { if(confirm('Удалить?')) db.ref('products/'+id).remove(); };
    window.tryLogin = () => { if(document.getElementById('pass').value === 'smkn00') { isAdmin = true; closeModal('loginOverlay'); document.getElementById('adminArea').style.display = 'block'; render(); } };
    window.openAdd = () => { document.getElementById('pForm').reset(); document.getElementById('pId').value = ''; document.getElementById('pImg').value = ''; curVariants = []; renderAV(); openModal('pOverlay'); };

    load();
</script>
</body>
</html>
