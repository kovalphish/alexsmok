<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smokin174 | Premium Price</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-black: #050505;
            --neon-green: #2bff00;
            --neon-blue: #0088cc;
            --neon-border: rgba(43, 255, 0, 0.3);
            --glass: rgba(15, 15, 15, 0.85);
            --gray-btn: #eeeeee; /* Цвет кнопки менеджера */
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-black); color: #fff; line-height: 1.5; overflow-x: hidden; min-height: 100vh; }

        /* АНИМИРОВАННЫЙ ФОН */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .circle { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(43, 255, 0, 0.08) 0%, rgba(0,0,0,0) 70%); animation: move 25s infinite alternate ease-in-out; }
        @keyframes move { 0% { transform: translate(0, 0); } 100% { transform: translate(100px, 80px); } }

        /* ШАПКА */
        header { 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--neon-border); 
            padding: 0.6rem 0; position: sticky; top: 0; z-index: 1000; overflow: hidden;
        }
        header::before { content: ""; position: absolute; top: -50px; left: -50px; width: 150px; height: 150px; background: radial-gradient(circle, rgba(43, 255, 0, 0.1) 0%, transparent 70%); pointer-events: none; }

        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 15px; position: relative; z-index: 2; }
        .logo-block { display: flex; align-items: center; gap: 12px; }
        .main-logo { height: 42px; width: auto; }
        .price-label { font-size: 1.3rem; font-weight: 900; color: var(--neon-green); text-transform: uppercase; text-shadow: 0 0 8px var(--neon-green); }

        .nav-icons { display: flex; align-items: center; gap: 12px; }
        
        /* СТИЛЬ КНОПКИ МЕНЕДЖЕРА */
        .btn-manager {
            background: var(--gray-btn);
            color: #000 !important;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            border: none;
        }
        .btn-manager:hover { background: #ffffff; transform: scale(1.05); }

        .nav-icons a.tg-icon { color: #888; transition: var(--transition); text-decoration: none; }
        .nav-icons a.tg-icon:hover { color: var(--neon-blue); filter: drop-shadow(0 0 8px var(--neon-blue)); }

        /* КАТЕГОРИИ */
        .cat-bar { background: rgba(0,0,0,0.3); padding: 12px 0; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #111; }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-container { display: flex; gap: 10px; padding: 0 15px; max-width: 1200px; margin: 0 auto; }
        .cat-link { padding: 8px 18px; border-radius: 20px; background: #111; border: 1px solid #222; color: #888; cursor: pointer; transition: var(--transition); font-size: 0.85rem; }
        .cat-link.active { background: var(--neon-green); color: #000; font-weight: bold; border-color: var(--neon-green); }

        /* СЕТКА ТОВАРОВ */
        .main { max-width: 1200px; margin: 15px auto; padding: 0 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

        /* КАРТОЧКА */
        .card { background: var(--glass); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; display: flex; flex-direction: column; height: 100%; transition: var(--transition); position: relative; }
        .card:hover { border-color: var(--neon-green); transform: translateY(-3px); }
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #000; }
        .card-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-price { font-size: 1.1rem; font-weight: 800; color: var(--neon-green); }
        .btn-variants { background: rgba(43, 255, 0, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.8rem; width: 100%; margin-top: 10px; transition: var(--transition); }

        /* SKELETON */
        .skeleton { background: #111; height: 280px; border-radius: 15px; position: relative; overflow: hidden; }
        .skeleton::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent); animation: loading 1.5s infinite; }
        @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* MODALS */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; opacity: 0; transition: opacity 0.3s ease; }
        .overlay.active { display: flex; opacity: 1; }
        .modal { background: #0a0a0a; border: 1px solid var(--neon-border); padding: 25px; border-radius: 20px; width: 92%; max-width: 400px; max-height: 85vh; display: flex; flex-direction: column; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; color: #666; cursor: pointer; }
        .modal-scroll { overflow-y: auto; margin-bottom: 15px; }

        /* ADMIN */
        .inp { width: 100%; background: #151515; border: 1px solid #222; color: #fff; padding: 12px; border-radius: 12px; margin-bottom: 12px; outline: none; }
        .btn-main { background: var(--neon-green); color: #000; border: none; padding: 12px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="bg-animation" id="bgAnim"></div>

<header>
    <div class="header-content">
        <div class="logo-block">
            <img src="logo.jpg" alt="Logo" class="main-logo" onerror="this.style.display='none'">
            <div class="price-label">Прайс</div>
        </div>
        <div class="nav-icons">
            <a href="https://t.me/твой_менеджер" target="_blank" class="btn-manager">Менеджер</a>
            <a href="https://t.me/smokin174" target="_blank" class="tg-icon"><i class="fab fa-telegram fa-lg"></i></a>
            <div onclick="openModal('loginOverlay')" style="cursor:pointer; opacity: 0.1;"><i class="fas fa-fingerprint fa-lg"></i></div>
        </div>
    </div>
</header>

</body>
</html>
