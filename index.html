<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VapeStore | Магазин никотиновой продукции</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --success-color: #27ae60;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Шапка */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: var(--secondary-color);
        }

        /* Иконка админа */
        .admin-icon {
            background-color: var(--secondary-color);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .admin-icon:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        /* Категории сверху */
        .categories {
            background-color: white;
            padding: 1.5rem 0;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 80px;
            z-index: 99;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .categories-container {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 0 5px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            padding: 0.6rem 1.5rem;
            background-color: var(--light-color);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .category-btn:hover {
            background-color: #ddd;
        }

        .category-btn.active {
            background-color: var(--secondary-color);
            color: white;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal {
            background-color: white;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.4s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            color: var(--primary-color);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #777;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: var(--transition);
            text-align: center;
        }

        .btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .btn-success {
            background-color: var(--success-color);
        }

        .btn-success:hover {
            background-color: #219653;
        }

        /* Загрузка изображения */
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 1rem;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--secondary-color);
        }

        .upload-area.dragover {
            border-color: var(--success-color);
            background-color: rgba(39, 174, 96, 0.1);
        }

        .upload-icon {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 1rem;
        }

        .image-preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 1rem;
            border-radius: 5px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #eee;
            border-radius: 5px;
            margin-top: 1rem;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--success-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Сетка товаров */
        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0 1rem 0;
        }

        .products-header h1 {
            color: var(--primary-color);
            font-size: 2rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .product-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        .product-variants {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .variant-tag {
            background-color: var(--light-color);
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #333;
        }

        /* Кнопки редактирования */
        .product-admin-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: var(--transition);
        }

        .product-card:hover .product-admin-controls {
            opacity: 1;
        }

        .admin-control-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .edit-btn {
            background-color: var(--secondary-color);
            color: white;
        }

        .delete-btn {
            background-color: var(--accent-color);
            color: white;
        }

        /* Уведомление */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--success-color);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 5px;
            box-shadow: var(--shadow);
            display: none;
            z-index: 1001;
            animation: slideIn 0.3s ease;
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Футер */
        footer {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem 0;
            margin-top: 3rem;
        }

        .footer-content {
            text-align: center;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1.5rem;
            }
            
            .category-btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
            
            .modal {
                padding: 1.5rem;
            }
            
            .categories {
                top: 70px;
            }
        }
    </style>
</head>
<body>
    <!-- Уведомление -->
    <div class="notification" id="notification"></div>

    <!-- Шапка сайта -->
    <header>
        <div class="container header-content">
            <a href="#" class="logo">
                <i class="fas fa-smoking"></i>
                VapeStore
            </a>
            <div class="admin-icon" id="adminIcon">
                <i class="fas fa-user-lock"></i>
            </div>
        </div>
    </header>

    <!-- Категории сверху -->
    <section class="categories">
        <div class="container">
            <div class="categories-container" id="categoriesContainer">
                <!-- Категории будут загружаться здесь -->
            </div>
        </div>
    </section>

    <!-- Модальное окно авторизации -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Авторизация администратора</h2>
                <button class="close-btn" id="closeLoginModal">&times;</button>
            </div>
            <div id="loginForm">
                <div class="form-group">
                    <label for="password">Пароль администратора</label>
                    <input type="password" id="password" class="form-control" placeholder="Введите пароль" required>
                </div>
                <button class="btn btn-success" id="loginBtn" style="width: 100%;">Войти</button>
            </div>
            <p id="loginMessage" style="margin-top: 1rem; color: var(--accent-color); display: none;">Неверный пароль</p>
        </div>
    </div>

    <!-- Основной контент -->
    <main class="container">
        <!-- Заголовок и информация о товарах -->
        <div class="products-header">
            <h1 id="categoryTitle">Все товары</h1>
            <p id="productsCount">Загрузка...</p>
        </div>

        <!-- Сетка товаров -->
        <div class="products-grid" id="productsGrid">
            <!-- Товары будут загружаться здесь -->
        </div>

        <!-- Кнопка добавления товара (только для админа) -->
        <div id="addProductButton" style="display: none; text-align: center; margin: 3rem 0;">
            <button class="btn btn-success" id="showAddProductModal" style="font-size: 1.2rem; padding: 1rem 2rem;">
                <i class="fas fa-plus"></i> Добавить новый товар
            </button>
        </div>
    </main>

    <!-- Модальное окно добавления/редактирования товара -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Добавление товара</h2>
                <button class="close-btn" id="closeProductModal">&times;</button>
            </div>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">Название товара *</label>
                    <input type="text" id="productName" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="productPrice">Цена (₽) *</label>
                    <input type="number" id="productPrice" class="form-control" min="0" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label for="productCategory">Категория *</label>
                    <input type="text" id="productCategory" class="form-control" placeholder="Например: Одноразовые вейпы" required>
                </div>
                
                <div class="form-group">
                    <label for="productDescription">Описание товара</label>
                    <textarea id="productDescription" class="form-control" rows="3"></textarea>
                </div>
                
                <!-- Загрузка изображения -->
                <div class="form-group">
                    <label>Изображение товара *</label>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">
                            <i class="fas fa-cloud-upload-alt"></i>
                        </div>
                        <p>Нажмите или перетащите сюда изображение</p>
                        <p style="color: #666; font-size: 0.9rem;">JPG, PNG, размер до 5MB</p>
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                        <img id="imagePreview" class="image-preview" src="" alt="Предпросмотр">
                        <div class="progress-bar" id="progressBar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <p id="progressText" style="color: #666; font-size: 0.9rem; margin-top: 0.5rem; display: none;"></p>
                    </div>
                    <input type="hidden" id="imageUrl" value="">
                </div>
                
                <!-- Варианты товара -->
                <div class="form-group">
                    <label>Варианты товара (вкусы, цвета)</label>
                    <p style="color: #666; font-size: 0.9rem; margin-bottom: 0.5rem;">Например: Вкус: Мята, Цвет: Черный</p>
                    <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
                        <input type="text" id="variantType" class="form-control" placeholder="Тип (напр. Вкус)" style="flex: 1;">
                        <input type="text" id="variantValue" class="form-control" placeholder="Значение (напр. Мята)" style="flex: 1;">
                        <button type="button" class="btn" id="addVariantBtn">+</button>
                    </div>
                    <div class="variants-container" id="variantsContainer"></div>
                </div>
                
                <input type="hidden" id="productId" value="">
                <button type="submit" class="btn btn-success" id="saveProductBtn" style="width: 100%;">Сохранить товар</button>
            </form>
        </div>
    </div>

    <!-- Подвал -->
    <footer>
        <div class="container footer-content">
            <p>VapeStore &copy; 2026 | Магазин никотиновой продукции</p>
            <p>Товары предназначены для лиц старше 18 лет</p>
        </div>
    </footer>

    <script>
        // === ВАША КОНФИГУРАЦИЯ FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyD3wDw2ZTTXn2gY467grDOVi9E5vcusilc",
            authDomain: "alexsmok-1dc1c.firebaseapp.com",
            databaseURL: "https://alexsmok-1dc1c-default-rtdb.firebaseio.com",
            projectId: "alexsmok-1dc1c",
            storageBucket: "alexsmok-1dc1c.firebasestorage.app",
            messagingSenderId: "173792761960",
            appId: "1:173792761960:web:5bc84d324322edd58ac3dd"
        };

        document.addEventListener('DOMContentLoaded', function() {
            // Инициализируем Firebase
            try {
                firebase.initializeApp(firebaseConfig);
            } catch (error) {
                console.log('Firebase уже инициализирован');
            }
            
            const db = firebase.database();
            const storage = firebase.storage();
            
            console.log('Firebase подключен');

            // Элементы DOM
            const adminIcon = document.getElementById('adminIcon');
            const loginModal = document.getElementById('loginModal');
            const closeLoginModal = document.getElementById('closeLoginModal');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const loginMessage = document.getElementById('loginMessage');
            const addProductButton = document.getElementById('addProductButton');
            const showAddProductModal = document.getElementById('showAddProductModal');
            const productModal = document.getElementById('productModal');
            const closeProductModal = document.getElementById('closeProductModal');
            const modalTitle = document.getElementById('modalTitle');
            const productsGrid = document.getElementById('productsGrid');
            const productsCount = document.getElementById('productsCount');
            const categoryTitle = document.getElementById('categoryTitle');
            const categoriesContainer = document.getElementById('categoriesContainer');
            const notification = document.getElementById('notification');
            
            // Форма товара
            const productForm = document.getElementById('productForm');
            const productName = document.getElementById('productName');
            const productPrice = document.getElementById('productPrice');
            const productCategory = document.getElementById('productCategory');
            const productDescription = document.getElementById('productDescription');
            const uploadArea = document.getElementById('uploadArea');
            const imageInput = document.getElementById('imageInput');
            const imagePreview = document.getElementById('imagePreview');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const imageUrl = document.getElementById('imageUrl');
            const addVariantBtn = document.getElementById('addVariantBtn');
            const variantType = document.getElementById('variantType');
            const variantValue = document.getElementById('variantValue');
            const variantsContainer = document.getElementById('variantsContainer');
            const saveProductBtn = document.getElementById('saveProductBtn');
            const productId = document.getElementById('productId');
            
            // Данные
            let products = [];
            let variants = [];
            let categories = new Set(); // Храним уникальные категории
            let isAdmin = false;
            let editingProductId = null;
            let currentImageFile = null;
            let uploadedImageUrl = '';
            let currentCategory = 'all';
            
            // Пароль администратора (ИЗМЕНИ НА СВОЙ!)
            const ADMIN_PASSWORD = "123456"; // ⚠️ ПОМЕНЯЙ ЭТОТ ПАРОЛЬ!
            
            // Уведомления
            function showNotification(message, type = 'success') {
                notification.textContent = message;
                notification.style.backgroundColor = type === 'success' ? '#27ae60' : '#e74c3c';
                notification.style.display = 'block';
                setTimeout(() => notification.style.display = 'none', 3000);
            }
            
            // Обновление категорий из товаров
            function updateCategoriesFromProducts() {
                categories.clear();
                products.forEach(product => {
                    if (product.category) {
                        categories.add(product.category);
                    }
                });
                renderCategories();
            }
            
            // Отображение категорий сверху
            function renderCategories() {
                categoriesContainer.innerHTML = '';
                
                // Кнопка "Все товары"
                const allBtn = document.createElement('button');
                allBtn.className = `category-btn ${currentCategory === 'all' ? 'active' : ''}`;
                allBtn.textContent = 'Все товары';
                allBtn.onclick = () => {
                    currentCategory = 'all';
                    renderCategories();
                    renderProducts();
                };
                categoriesContainer.appendChild(allBtn);
                
                // Кнопки категорий
                Array.from(categories).sort().forEach(category => {
                    const btn = document.createElement('button');
                    btn.className = `category-btn ${currentCategory === category ? 'active' : ''}`;
                    btn.textContent = category;
                    btn.onclick = () => {
                        currentCategory = category;
                        renderCategories();
                        renderProducts();
                    };
                    categoriesContainer.appendChild(btn);
                });
            }
            
            // Загрузка товаров
            function loadProducts() {
                db.ref('products').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        products = Object.keys(data).map(key => ({
                            id: key,
                            ...data[key]
                        }));
                        console.log('Товары загружены:', products.length);
                        
                        // Обновляем категории
                        updateCategoriesFromProducts();
                    } else {
                        products = [];
                        categories.clear();
                        renderCategories();
                    }
                    
                    renderProducts();
                }, (error) => {
                    console.error('Ошибка загрузки товаров:', error);
                    showNotification('Ошибка загрузки товаров', 'error');
                });
            }
            
            // Отображение товаров
            function renderProducts() {
                productsGrid.innerHTML = '';
                
                // Фильтрация по категории
                let filteredProducts = products;
                if (currentCategory !== 'all') {
                    filteredProducts = products.filter(p => p.category === currentCategory);
                }
                
                // Сортировка по дате (новые первыми)
                filteredProducts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                
                // Обновляем заголовок
                categoryTitle.textContent = currentCategory === 'all' ? 'Все товары' : currentCategory;
                productsCount.textContent = `Товаров: ${filteredProducts.length}`;
                
                if (filteredProducts.length === 0) {
                    productsGrid.innerHTML = `
                        <div style="text-align: center; grid-column: 1 / -1; padding: 3rem;">
                            <i class="fas fa-box-open" style="font-size: 3rem; color: #ccc; margin-bottom: 1rem;"></i>
                            <p style="color: #666; font-size: 1.1rem;">Товаров пока нет</p>
                            ${isAdmin ? '<p style="color: #666; margin-top: 0.5rem;">Нажмите "Добавить товар"</p>' : ''}
                        </div>
                    `;
                    return;
                }
                
                filteredProducts.forEach(product => {
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card';
                    
                    // Формируем варианты
                    let variantsHTML = '';
                    if (product.variants && product.variants.length > 0) {
                        variantsHTML = `
                            <div class="product-variants">
                                ${product.variants.map(v => 
                                    `<span class="variant-tag">${v.type}: ${v.value}</span>`
                                ).join('')}
                            </div>
                        `;
                    }
                    
                    // Кнопки админа
                    let adminControlsHTML = '';
                    if (isAdmin) {
                        adminControlsHTML = `
                            <div class="product-admin-controls">
                                <button class="admin-control-btn edit-btn" onclick="editProduct('${product.id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="admin-control-btn delete-btn" onclick="deleteProduct('${product.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        `;
                    }
                    
                    productCard.innerHTML = `
                        ${adminControlsHTML}
                        <img src="${product.image}" alt="${product.name}" class="product-image" 
                             onerror="this.src='https://images.unsplash.com/photo-1571330735066-03aaa9429d89?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'">
                        <div class="product-info">
                            <h3 class="product-title">${product.name}</h3>
                            <div class="product-price">${product.price.toLocaleString()} ₽</div>
                            ${variantsHTML}
                            ${product.description ? `<p style="color: #666; margin-top: 0.5rem;">${product.description}</p>` : ''}
                        </div>
                    `;
                    
                    productsGrid.appendChild(productCard);
                });
            }
            
            // Отображение вариантов в форме
            function renderVariants() {
                variantsContainer.innerHTML = '';
                
                if (variants.length === 0) {
                    variantsContainer.innerHTML = '<p style="color: #666; font-size: 0.9rem; text-align: center; padding: 1rem;">Нет вариантов</p>';
                    return;
                }
                
                variants.forEach((variant, index) => {
                    const div = document.createElement('div');
                    div.style.cssText = 'background: #f0f0f0; padding: 0.5rem 1rem; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;';
                    div.innerHTML = `
                        <span><strong>${variant.type}:</strong> ${variant.value}</span>
                        <button type="button" onclick="removeVariant(${index})" style="background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 1.2rem;">×</button>
                    `;
                    variantsContainer.appendChild(div);
                });
            }
            
            // Удаление варианта
            window.removeVariant = function(index) {
                variants.splice(index, 1);
                renderVariants();
            };
            
            // Добавление варианта
            addVariantBtn.addEventListener('click', function() {
                const type = variantType.value.trim();
                const value = variantValue.value.trim();
                
                if (!type || !value) {
                    showNotification('Заполните тип и значение', 'error');
                    return;
                }
                
                variants.push({ type, value });
                renderVariants();
                
                variantType.value = '';
                variantValue.value = '';
                variantType.focus();
            });
            
            // Загрузка изображения
            uploadArea.addEventListener('click', () => imageInput.click());
            
            // Drag and drop
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                
                if (e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    if (file.type.startsWith('image/')) {
                        handleImageUpload(file);
                    } else {
                        showNotification('Выберите файл изображения', 'error');
                    }
                }
            });
            
            imageInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    handleImageUpload(file);
                }
            });
            
            function handleImageUpload(file) {
                // Проверка размера файла (максимум 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    showNotification('Файл слишком большой. Максимум 5MB', 'error');
                    return;
                }
                
                // Показываем предпросмотр
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
                
                currentImageFile = file;
                uploadedImageUrl = '';
                imageUrl.value = '';
                
                // Сбрасываем инпут файла, чтобы можно было загрузить тот же файл снова
                imageInput.value = '';
            }
            
            // Загрузка изображения в Firebase Storage
            async function uploadImageToFirebase() {
                if (!currentImageFile) {
                    throw new Error('Нет файла для загрузки');
                }
                
                // Создаем уникальное имя файла
                const fileName = Date.now() + '_' + currentImageFile.name.replace(/\s+/g, '_');
                const storageRef = storage.ref('products/' + fileName);
                
                // Показываем прогресс
                progressBar.style.display = 'block';
                progressText.style.display = 'block';
                progressFill.style.width = '0%';
                progressText.textContent = 'Начало загрузки...';
                
                return new Promise((resolve, reject) => {
                    const uploadTask = storageRef.put(currentImageFile);
                    
                    uploadTask.on('state_changed',
                        (snapshot) => {
                            // Прогресс загрузки
                            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                            progressFill.style.width = progress + '%';
                            progressText.textContent = `Загрузка: ${Math.round(progress)}%`;
                        },
                        (error) => {
                            // Ошибка
                            progressBar.style.display = 'none';
                            progressText.style.display = 'none';
                            reject(error);
                        },
                        async () => {
                            // Успех
                            try {
                                const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
                                progressBar.style.display = 'none';
                                progressText.style.display = 'none';
                                uploadedImageUrl = downloadURL;
                                imageUrl.value = downloadURL;
                                showNotification('Изображение загружено!');
                                resolve(downloadURL);
                            } catch (error) {
                                reject(error);
                            }
                        }
                    );
                });
            }
            
            // Редактирование товара
            window.editProduct = async function(id) {
                const product = products.find(p => p.id === id);
                if (!product) {
                    showNotification('Товар не найден', 'error');
                    return;
                }
                
                // Заполняем форму
                productName.value = product.name;
                productPrice.value = product.price;
                productCategory.value = product.category || '';
                productDescription.value = product.description || '';
                productId.value = product.id;
                
                // Показываем текущее изображение
                if (product.image) {
                    imagePreview.src = product.image;
                    imagePreview.style.display = 'block';
                    uploadedImageUrl = product.image;
                    imageUrl.value = product.image;
                }
                
                // Заполняем варианты
                variantsContainer.innerHTML = '';
                variants = product.variants ? [...product.variants] : [];
                renderVariants();
                
                // Обновляем заголовок
                modalTitle.textContent = 'Редактировать товар';
                saveProductBtn.textContent = 'Обновить товар';
                
                // Показываем модалку
                productModal.style.display = 'flex';
                editingProductId = id;
            };
            
            // Удаление товара
            window.deleteProduct = async function(id) {
                if (!confirm('Удалить этот товар?')) return;
                
                try {
                    await db.ref('products/' + id).remove();
                    showNotification('Товар удален');
                } catch (error) {
                    console.error('Ошибка удаления:', error);
                    showNotification('Ошибка удаления', 'error');
                }
            };
            
            // Сохранение товара
            productForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const name = productName.value.trim();
                const price = parseFloat(productPrice.value);
                const category = productCategory.value.trim();
                const description = productDescription.value.trim();
                const id = productId.value;
                
                if (!name || !price || !category) {
                    showNotification('Заполните все обязательные поля', 'error');
                    return;
                }
                
                if (price <= 0) {
                    showNotification('Цена должна быть больше 0', 'error');
                    return;
                }
                
                // Если есть новый файл - загружаем его
                if (currentImageFile && !uploadedImageUrl) {
                    try {
                        saveProductBtn.disabled = true;
                        saveProductBtn.textContent = 'Загрузка изображения...';
                        await uploadImageToFirebase();
                    } catch (error) {
                        console.error('Ошибка загрузки изображения:', error);
                        showNotification('Ошибка загрузки изображения', 'error');
                        saveProductBtn.disabled = false;
                        saveProductBtn.textContent = editingProductId ? 'Обновить товар' : 'Сохранить товар';
                        return;
                    }
                }
                
                const image = imageUrl.value || uploadedImageUrl;
                
                if (!image) {
                    showNotification('Загрузите изображение', 'error');
                    saveProductBtn.disabled = false;
                    saveProductBtn.textContent = editingProductId ? 'Обновить товар' : 'Сохранить товар';
                    return;
                }
                
                const productData = {
                    name,
                    price,
                    category,
                    image,
                    variants,
                    updatedAt: Date.now()
                };
                
                // Добавляем опциональные поля
                if (description) productData.description = description;
                
                try {
                    if (id) {
                        // Обновление
                        await db.ref('products/' + id).update(productData);
                        showNotification('Товар обновлен!');
                    } else {
                        // Добавление
                        productData.createdAt = Date.now();
                        await db.ref('products').push(productData);
                        showNotification('Товар добавлен!');
                    }
                    
                    productModal.style.display = 'none';
                    resetProductForm();
                } catch (error) {
                    console.error('Ошибка сохранения:', error);
                    showNotification('Ошибка сохранения', 'error');
                } finally {
                    saveProductBtn.disabled = false;
                    saveProductBtn.textContent = editingProductId ? 'Обновить товар' : 'Сохранить товар';
                }
            });
            
            // Сброс формы
            function resetProductForm() {
                productForm.reset();
                variants = [];
                renderVariants();
                productId.value = '';
                imagePreview.style.display = 'none';
                progressBar.style.display = 'none';
                progressText.style.display = 'none';
                currentImageFile = null;
                uploadedImageUrl = '';
                imageUrl.value = '';
                modalTitle.textContent = 'Добавить товар';
                saveProductBtn.textContent = 'Сохранить товар';
                editingProductId = null;
            }
            
            // Авторизация
            loginBtn.addEventListener('click', function() {
                const password = passwordInput.value.trim();
                
                if (password === ADMIN_PASSWORD) {
                    isAdmin = true;
                    loginModal.style.display = 'none';
                    addProductButton.style.display = 'block';
                    
                    // Обновляем товары с кнопками редактирования
                    renderProducts();
                    
                    showNotification('Вы вошли как администратор');
                } else {
                    loginMessage.style.display = 'block';
                }
            });
            
            // Выход из админки
            adminIcon.addEventListener('click', function() {
                if (isAdmin) {
                    // Выход
                    isAdmin = false;
                    addProductButton.style.display = 'none';
                    renderProducts();
                    showNotification('Вы вышли из режима администратора');
                } else {
                    // Вход
                    loginModal.style.display = 'flex';
                    passwordInput.focus();
                }
            });
            
            // Показать форму добавления товара
            showAddProductModal.addEventListener('click', function() {
                resetProductForm();
                productModal.style.display = 'flex';
            });
            
            // Закрытие модалок
            closeLoginModal.addEventListener('click', () => {
                loginModal.style.display = 'none';
                loginMessage.style.display = 'none';
            });
            
            closeProductModal.addEventListener('click', () => {
                productModal.style.display = 'none';
                resetProductForm();
            });
            
            // Закрытие при клике вне окна
            document.querySelectorAll('.modal-overlay').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.style.display = 'none';
                        if (this === loginModal) loginMessage.style.display = 'none';
                        if (this === productModal) resetProductForm();
                    }
                });
            });
            
            // Запускаем загрузку данных
            loadProducts();
            
            console.log('Приложение запущено!');
            
            // Инструкция по настройке Firebase
            console.log(`
            ============================================
            НАСТРОЙКА FIREBASE ПРАВИЛ (ВАЖНО!):
            
            1. Realtime Database → Rules:
               {
                 "rules": {
                   ".read": true,
                   ".write": true
                 }
               }
            
            2. Storage → Rules:
               rules_version = '2';
               service firebase.storage {
                 match /b/{bucket}/o {
                   match /{allPaths=**} {
                     allow read, write;
                   }
                 }
               }
            
            3. Нажмите "Publish" в каждом разделе
            
            4. ⚠️ ПОМЕНЯЙТЕ ПАРОЛЬ в коде:
               const ADMIN_PASSWORD = "123456";
            ============================================
            `);
        });
    </script>
</body>
</html>
