<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smokin174 | Premium Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-black: #050505;
            --card-bg: linear-gradient(145deg, #0f0f0f, #050505);
            --neon-green: #2bff00;
            --dark-green: #1eb300;
            --neon-border: rgba(43, 255, 0, 0.3);
            --text-gray: #b0b0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-black); color: #fff; line-height: 1.6; }

        /* СТИЛЬНЫЙ ГРАДИЕНТНЫЙ ХЕДЕР */
        header { 
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--neon-border);
            padding: 1.2rem 0; position: sticky; top: 0; z-index: 1000;
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .logo { font-size: 1.6rem; font-weight: 900; color: #fff; text-decoration: none; letter-spacing: 2px; }
        .logo span { color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); }

        /* КАТЕГОРИИ */
        .cat-bar { background: #000; padding: 15px 0; border-bottom: 1px solid #111; overflow-x: auto; white-space: nowrap; }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 10px; }
        .cat-link { 
            padding: 8px 18px; border-radius: 50px; background: #111; border: 1px solid #222;
            color: var(--text-gray); cursor: pointer; transition: 0.3s; font-size: 0.9rem;
        }
        .cat-link.active { background: var(--neon-green); color: #000; font-weight: bold; box-shadow: 0 0 15px rgba(43, 255, 0, 0.4); }

        /* СЕТКА ТОВАРОВ */
        .main { max-width: 1200px; margin: 25px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }

        /* КАРТОЧКА ТОВАРА */
        .card { 
            background: var(--card-bg); border-radius: 18px; border: 1px solid #1a1a1a;
            overflow: hidden; display: flex; flex-direction: column; transition: 0.4s; position: relative;
        }
        .card:hover { border-color: var(--neon-green); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-img { width: 100%; height: 220px; object-fit: cover; background: #000; }
        .card-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-name { font-size: 1rem; font-weight: 500; margin-bottom: 5px; color: #fff; }
        .card-price { font-size: 1.2rem; font-weight: 800; color: var(--neon-green); margin-bottom: 15px; }

        /* КНОПКА ВКУСОВ */
        .btn-variants {
            background: rgba(43, 255, 0, 0.05); border: 1px solid var(--neon-green); color: var(--neon-green);
            padding: 10px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.85rem;
            transition: 0.3s; margin-top: auto;
        }
        .btn-variants:hover { background: var(--neon-green); color: #000; }

        /* МОДАЛЬНЫЕ ОКНА */
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal { 
            background: #0f0f0f; border: 1px solid #222; padding: 25px; border-radius: 24px;
            width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto;
        }
        .modal h2 { color: var(--neon-green); margin-bottom: 15px; font-size: 1.4rem; }
        .v-item { background: #151515; padding: 12px 15px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #222; color: #eee; }

        /* АДМИНКА */
        .admin-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 5px; z-index: 10; }
        .a-btn { width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .inp { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 12px; margin-bottom: 12px; outline: none; }
        .inp:focus { border-color: var(--neon-green); }
        .btn-main { background: var(--neon-green); color: #000; border: none; padding: 12px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <a href="#" class="logo">SMOKIN<span>174</span></a>
        <div onclick="openLogin()" style="cursor:pointer; color: var(--text-gray);"><i class="fas fa-fingerprint"></i></div>
    </div>
</header>

<div class="cat-bar">
    <div class="cat-container" id="cats"></div>
</div>

<main class="main">
    <div class="grid" id="productGrid"></div>
    <div id="adminArea" style="display:none; text-align:center; margin-top:30px;">
        <button class="btn-main" onclick="openAdd()" style="width:auto; padding:12px 40px;">+ ДОБАВИТЬ ТОВАР</button>
    </div>
</main>

<div class="overlay" id="vOverlay" onclick="this.style.display='none'">
    <div class="modal" onclick="event.stopPropagation()">
        <h2 id="vTitle">Вкусы</h2>
        <div id="vList"></div>
    </div>
</div>

<div class="overlay" id="pOverlay">
    <div class="modal">
        <h2 id="mTitle">Товар</h2>
        <form id="pForm">
            <input type="hidden" id="pId">
            <input type="text" id="pName" placeholder="Название" class="inp" required>
            <input type="number" id="pPrice" placeholder="Цена" class="inp" required>
            <input type="text" id="pCat" placeholder="Категория" class="inp" required>
            
            <div style="background: #000; padding: 15px; border-radius: 15px; margin-bottom: 12px; border: 1px solid #222;">
                <p style="color:var(--neon-green); font-size:0.8rem; margin-bottom:5px;">Имя кнопки (напр. Вкусы)</p>
                <input type="text" id="pBtnName" placeholder="Вкусы" class="inp">
                
                <p style="font-size:0.8rem; margin-bottom:5px;">Добавить в список:</p>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="vInp" class="inp" style="margin-bottom:0">
                    <button type="button" onclick="addV()" class="btn-main" style="width:50px;">+</button>
                </div>
                <div id="adminVList" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:5px;"></div>
            </div>

            <p style="font-size:0.8rem; margin-bottom:5px;">Фото товара:</p>
            <input type="file" id="fInp" class="inp">
            <input type="hidden" id="pImg">
            <button type="submit" class="btn-main">СОХРАНИТЬ</button>
            <button type="button" onclick="closeModal('pOverlay')" style="background:none; color:#666; border:none; margin-top:10px; cursor:pointer; width:100%;">Отмена</button>
        </form>
    </div>
</div>

<div class="overlay" id="loginOverlay">
    <div class="modal" style="max-width:300px;">
        <h2>Admin Access</h2>
        <input type="password" id="pass" class="inp" placeholder="Пароль">
        <button onclick="tryLogin()" class="btn-main">ВОЙТИ</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD3wDw2ZTTXn2gY467grDOVi9E5vcusilc",
        authDomain: "alexsmok-1dc1c.firebaseapp.com",
        databaseURL: "https://alexsmok-1dc1c-default-rtdb.firebaseio.com",
        projectId: "alexsmok-1dc1c",
        appId: "1:173792761960:web:5bc84d324322edd58ac3dd"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let products = [];
    let curVariants = [];
    let isAdmin = false;
    let curCat = 'all';

    function load() {
        db.ref('products').on('value', snap => {
            const val = snap.val();
            products = val ? Object.keys(val).map(k => ({id:k, ...val[k]})) : [];
            render();
        });
    }

    function render() {
        // Категории
        const cats = ['all', ...new Set(products.map(p => p.category))];
        document.getElementById('cats').innerHTML = cats.map(c => `
            <div class="cat-link ${curCat === c ? 'active' : ''}" onclick="setCat('${c}')">
                ${c === 'all' ? 'Все' : c}
            </div>
        `).join('');

        // Сетка
        const filtered = curCat === 'all' ? products : products.filter(p => p.category === curCat);
        document.getElementById('productGrid').innerHTML = filtered.map(p => {
            // ИСПРАВЛЕНИЕ КАРТИНОК: проверка на наличие заголовка base64
            const imgSource = p.imageData.startsWith('data:image') ? p.imageData : `data:image/jpeg;base64,${p.imageData}`;
            
            return `
                <div class="card">
                    ${isAdmin ? `
                        <div class="admin-tools">
                            <button class="a-btn" style="background:#007bff" onclick="editP('${p.id}')"><i class="fas fa-pen"></i></button>
                            <button class="a-btn" style="background:#ff4444" onclick="delP('${p.id}')"><i class="fas fa-trash"></i></button>
                        </div>
                    ` : ''}
                    <img src="${imgSource}" class="card-img" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                    <div class="card-info">
                        <h3 class="card-name">${p.name}</h3>
                        <div class="card-price">${p.price} ₽</div>
                        ${p.variants && p.variants.length > 0 ? 
                            `<button class="btn-variants" onclick="openV('${p.id}')">${p.variantButtonName || 'Вкусы'} (${p.variants.length})</button>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    window.setCat = (c) => { curCat = c; render(); };

    window.openV = (id) => {
        const p = products.find(x => x.id === id);
        document.getElementById('vTitle').textContent = p.variantButtonName || 'Вкусы';
        document.getElementById('vList').innerHTML = p.variants.map(v => `<div class="v-item">${v}</div>`).join('');
        document.getElementById('vOverlay').style.display = 'flex';
    };

    window.addV = () => {
        const v = document.getElementById('vInp').value.trim();
        if(v) { curVariants.push(v); document.getElementById('vInp').value = ''; renderAV(); }
    };

    function renderAV() {
        document.getElementById('adminVList').innerHTML = curVariants.map((v, i) => `
            <span style="background:#222; padding:5px 12px; border-radius:8px; font-size:0.8rem; border:1px solid #333;">
                ${v} <i class="fas fa-times" onclick="curVariants.splice(${i},1);renderAV()" style="color:#ff4444; cursor:pointer; margin-left:8px"></i>
            </span>
        `).join('');
    }

    document.getElementById('pForm').onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('pId').value;
        const data = {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            category: document.getElementById('pCat').value,
            variantButtonName: document.getElementById('pBtnName').value || 'Вкусы',
            variants: curVariants,
            imageData: document.getElementById('pImg').value,
            updatedAt: Date.now()
        };
        if(!data.imageData) return alert('Вы не выбрали фото!');
        
        id ? await db.ref('products/'+id).update(data) : await db.ref('products').push(data);
        closeModal('pOverlay');
    };

    document.getElementById('fInp').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => document.getElementById('pImg').value = ev.target.result; // Сохраняем полный путь с data:image
        reader.readAsDataURL(e.target.files[0]);
    };

    window.editP = (id) => {
        const p = products.find(x => x.id === id);
        document.getElementById('pId').value = p.id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pCat').value = p.category;
        document.getElementById('pBtnName').value = p.variantButtonName || '';
        document.getElementById('pImg').value = p.imageData;
        curVariants = p.variants ? [...p.variants] : [];
        renderAV();
        document.getElementById('pOverlay').style.display = 'flex';
    };

    window.delP = (id) => { if(confirm('Удалить этот товар?')) db.ref('products/'+id).remove(); };
    window.openLogin = () => document.getElementById('loginOverlay').style.display = 'flex';

    window.tryLogin = () => {
        if(document.getElementById('pass').value === 'smkn00') {
            isAdmin = true; closeModal('loginOverlay');
            document.getElementById('adminArea').style.display = 'block'; render();
        } else alert('Неверный пароль!');
    };

    window.openAdd = () => {
        document.getElementById('pForm').reset();
        document.getElementById('pId').value = '';
        document.getElementById('pImg').value = '';
        curVariants = []; renderAV();
        document.getElementById('pOverlay').style.display = 'flex';
    };

    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    load();
</script>
</body>
</html>
