<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smokin174 | Магазин никотиновой продукции</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --success-color: #27ae60;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body { background-color: #f9f9f9; color: #333; line-height: 1.6; }
        .container { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 20px; }

        header { background-color: var(--primary-color); color: white; padding: 1rem 0; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 700; color: white; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--secondary-color); }

        .admin-icon { background-color: var(--secondary-color); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); box-shadow: var(--shadow); }

        .categories { background-color: white; padding: 1.5rem 0; border-bottom: 1px solid #eee; position: sticky; top: 80px; z-index: 99; }
        .categories-container { display: flex; overflow-x: auto; gap: 10px; scrollbar-width: none; }
        .categories-container::-webkit-scrollbar { display: none; }
        .category-btn { padding: 0.6rem 1.5rem; background-color: var(--light-color); border: none; border-radius: 25px; cursor: pointer; white-space: nowrap; transition: var(--transition); font-weight: 500; }
        .category-btn.active { background-color: var(--secondary-color); color: white; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background-color: white; border-radius: 10px; width: 90%; max-width: 500px; padding: 2rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #777; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 500; }
        .form-control { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }

        .btn { display: inline-block; padding: 0.8rem 1.5rem; background-color: var(--secondary-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; transition: var(--transition); text-align: center; width: 100%; }
        .btn-success { background-color: var(--success-color); }

        .upload-area { border: 2px dashed #ddd; border-radius: 10px; padding: 1.5rem; text-align: center; cursor: pointer; margin-bottom: 1rem; }
        .image-preview { max-width: 100%; max-height: 150px; margin-top: 1rem; border-radius: 5px; display: none; margin-left: auto; margin-right: auto; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        @media (max-width: 768px) { .products-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; } }

        .product-card { background-color: white; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); position: relative; display: flex; flex-direction: column; height: 100%; }
        .product-image { width: 100%; height: 180px; object-fit: cover; background-color: #f5f5f5; }
        .product-info { padding: 1rem; flex-grow: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--primary-color); }
        .product-price { font-size: 1.3rem; font-weight: 700; color: var(--accent-color); margin-bottom: 0.8rem; }

        .variant-view-btn { background-color: #f0f0f0; color: #333; border: 1px solid #ddd; padding: 0.5rem; border-radius: 5px; font-size: 0.9rem; cursor: pointer; margin-top: auto; }
        .variant-view-btn:hover { background-color: #e0e0e0; }

        .variants-list-container { display: grid; gap: 8px; max-height: 300px; overflow-y: auto; padding: 5px; }
        .variant-item-badge { background: var(--light-color); padding: 10px; border-radius: 5px; text-align: center; font-weight: 500; border: 1px solid #eee; }

        .product-admin-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; z-index: 10; }
        .admin-control-btn { width: 32px; height: 32px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }
        
        .notification { position: fixed; top: 20px; right: 20px; background-color: var(--success-color); color: white; padding: 1rem 1.5rem; border-radius: 5px; display: none; z-index: 2000; }
        
        footer { background-color: var(--primary-color); color: white; padding: 2rem 0; margin-top: 3rem; text-align: center; }
    </style>
</head>
<body>
    <div class="notification" id="notification"></div>

    <header>
        <div class="container header-content">
            <a href="#" class="logo"><i class="fas fa-smoking"></i> Smokin174</a>
            <div class="admin-icon" id="adminIcon"><i class="fas fa-user-lock"></i></div>
        </div>
    </header>

    <section class="categories">
        <div class="container">
            <div class="categories-container" id="categoriesContainer"></div>
        </div>
    </section>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem;">
            <h1 id="categoryTitle">Все товары</h1>
            <p id="productsCount">Загрузка...</p>
        </div>

        <div class="products-grid" id="productsGrid"></div>

        <div id="addProductButton" style="display: none; text-align: center; margin: 3rem 0;">
            <button class="btn btn-success" id="showAddProductModal" style="width: auto;"><i class="fas fa-plus"></i> Добавить товар</button>
        </div>
    </main>

    <div class="modal-overlay" id="variantsViewModal">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h2 id="variantsViewTitle">Доступные варианты</h2>
                <button class="close-btn" id="closeVariantsViewModal">&times;</button>
            </div>
            <div id="variantsViewList" class="variants-list-container"></div>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Админ-панель</h2>
                <button class="close-btn" id="closeLoginModal">&times;</button>
            </div>
            <input type="password" id="password" class="form-control" placeholder="Пароль">
            <button class="btn btn-success" id="loginBtn" style="margin-top: 1rem;">Войти</button>
            <p id="loginMessage" style="color: var(--accent-color); display: none; margin-top: 10px;">Неверный пароль</p>
        </div>
    </div>

    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Товар</h2>
                <button class="close-btn" id="closeProductModal">&times;</button>
            </div>
            <form id="productForm">
                <div class="form-group">
                    <label>Название *</label>
                    <input type="text" id="productName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Цена (₽) *</label>
                    <input type="number" id="productPrice" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Категория *</label>
                    <input type="text" id="productCategory" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="productDescription" class="form-control" rows="2"></textarea>
                </div>

                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 2rem; color: #ccc;"></i>
                    <p>Фото (до 500KB)</p>
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <img id="imagePreview" class="image-preview">
                </div>

                <div class="form-group" style="background: #f8f9fa; padding: 10px; border-radius: 5px;">
                    <label>Настройка кнопки вариантов</label>
                    <input type="text" id="variantBtnName" class="form-control" placeholder="Напр: Вкусы, Цвета, Крепость" style="margin-bottom: 10px;">
                    
                    <label>Добавить значение в список</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="variantValue" class="form-control" placeholder="Напр: Ледяной арбуз">
                        <button type="button" class="btn" id="addVariantBtn" style="width: 50px;">+</button>
                    </div>
                    <div id="adminVariantsContainer" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px;"></div>
                </div>

                <input type="hidden" id="productId">
                <input type="hidden" id="imageData">
                <button type="submit" class="btn btn-success" id="saveProductBtn" style="margin-top: 10px;">Сохранить</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>Smokin174 &copy; 2026 | 18+</p>
        </div>
    </footer>

    <script>
        [span_2](start_span)// Конфигурация[span_2](end_span)
        const firebaseConfig = {
            apiKey: "AIzaSyD3wDw2ZTTXn2gY467grDOVi9E5vcusilc",
            authDomain: "alexsmok-1dc1c.firebaseapp.com",
            databaseURL: "https://alexsmok-1dc1c-default-rtdb.firebaseio.com",
            projectId: "alexsmok-1dc1c",
            messagingSenderId: "173792761960",
            appId: "1:173792761960:web:5bc84d324322edd58ac3dd"
        };

        document.addEventListener('DOMContentLoaded', function() {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            [span_3](start_span)const ADMIN_PASSWORD = "smkn00";[span_3](end_span)

            let products = [];
            let currentVariants = [];
            let isAdmin = false;
            let currentCategory = 'all';

            // Элементы
            const productsGrid = document.getElementById('productsGrid');
            const adminVariantsContainer = document.getElementById('adminVariantsContainer');

            function showNotification(msg, type='success') {
                const n = document.getElementById('notification');
                n.textContent = msg;
                n.style.backgroundColor = type === 'success' ? '#27ae60' : '#e74c3c';
                n.style.display = 'block';
                setTimeout(() => n.style.display = 'none', 3000);
            }

            [span_4](start_span)// Загрузка[span_4](end_span)
            function loadProducts() {
                db.ref('products').on('value', (snapshot) => {
                    const data = snapshot.val();
                    [span_5](start_span)products = data ? Object.keys(data).map(id => ({id, ...data[id]})) : [];[span_5](end_span)
                    renderCategories();
                    renderProducts();
                });
            }

            function renderCategories() {
                const container = document.getElementById('categoriesContainer');
                [span_6](start_span)const cats = new Set(products.map(p => p.category));[span_6](end_span)
                container.innerHTML = `<button class="category-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="filterCat('all')">Все</button>`;
                Array.from(cats).sort().forEach(c => {
                    container.innerHTML += `<button class="category-btn ${currentCategory === c ? 'active' : ''}" onclick="filterCat('${c}')">${c}</button>`;
                });
            }

            window.filterCat = (cat) => {
                currentCategory = cat;
                renderCategories();
                renderProducts();
            };

            function renderProducts() {
                productsGrid.innerHTML = '';
                [span_7](start_span)const filtered = currentCategory === 'all' ? products : products.filter(p => p.category === currentCategory);[span_7](end_span)
                
                document.getElementById('productsCount').textContent = `Товаров: ${filtered.length}`;

                filtered.sort((a,b) => b.updatedAt - a.updatedAt).forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    [span_8](start_span)const btnName = p.variantButtonName || "Выбрать вкус";[span_8](end_span)
                    const variantsBtn = (p.variants && p.variants.length > 0) 
                        ? `<button class="variant-view-btn" onclick="openVariantsView('${p.id}')">${btnName} (${p.variants.length})</button>` 
                        [span_9](start_span): '';[span_9](end_span)

                    const adminBtns = isAdmin ? `
                        <div class="product-admin-controls">
                            <button class="admin-control-btn" style="background:var(--secondary-color)" onclick="editProduct('${p.id}')"><i class="fas fa-edit"></i></button>
                            <button class="admin-control-btn" style="background:var(--accent-color)" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
                        </div>` : '';

                    card.innerHTML = `
                        ${adminBtns}
                        <img src="data:image/jpeg;base64,${p.imageData}" class="product-image">
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="product-price">${p.price} ₽</div>
                            ${variantsBtn}
                        </div>
                    `;
                    productsGrid.appendChild(card);
                });
            }

            [span_10](start_span)[span_11](start_span)// Просмотр вариантов для клиента[span_10](end_span)[span_11](end_span)
            window.openVariantsView = (id) => {
                const p = products.find(x => x.id === id);
                const list = document.getElementById('variantsViewList');
                document.getElementById('variantsViewTitle').textContent = p.variantButtonName || "Варианты";
                list.innerHTML = '';
                p.variants.forEach(v => {
                    list.innerHTML += `<div class="variant-item-badge">${v}</div>`;
                });
                document.getElementById('variantsViewModal').style.display = 'flex';
            };

            [span_12](start_span)// Админка: добавление вариантов[span_12](end_span)
            document.getElementById('addVariantBtn').onclick = () => {
                const val = document.getElementById('variantValue').value.trim();
                if(val) {
                    currentVariants.push(val);
                    document.getElementById('variantValue').value = '';
                    renderAdminVariants();
                }
            };

            function renderAdminVariants() {
                adminVariantsContainer.innerHTML = '';
                currentVariants.forEach((v, i) => {
                    const span = document.createElement('span');
                    span.className = 'variant-item-badge';
                    span.style.padding = '5px 10px';
                    span.innerHTML = `${v} <i class="fas fa-times" style="color:red; cursor:pointer" onclick="removeVar(${i})"></i>`;
                    adminVariantsContainer.appendChild(span);
                });
            }

            window.removeVar = (i) => {
                currentVariants.splice(i, 1);
                renderAdminVariants();
            };

            [span_13](start_span)[span_14](start_span)// Сохранение[span_13](end_span)[span_14](end_span)
            document.getElementById('productForm').onsubmit = async (e) => {
                e.preventDefault();
                const id = document.getElementById('productId').value;
                const data = {
                    name: document.getElementById('productName').value,
                    price: Number(document.getElementById('productPrice').value),
                    category: document.getElementById('productCategory').value,
                    description: document.getElementById('productDescription').value,
                    [span_15](start_span)variantButtonName: document.getElementById('variantBtnName').value,[span_15](end_span)
                    [span_16](start_span)variants: currentVariants,[span_16](end_span)
                    imageData: document.getElementById('imageData').value,
                    updatedAt: Date.now()
                };

                if(!data.imageData) return showNotification("Загрузите фото", "error");

                try {
                    if(id) await db.ref('products/'+id).update(data);
                    else await db.ref('products').push({...data, createdAt: Date.now()});
                    document.getElementById('productModal').style.display = 'none';
                    showNotification("Готово!");
                } catch(e) { showNotification("Ошибка", "error"); }
            };

            [span_17](start_span)[span_18](start_span)// Работа с фото[span_17](end_span)[span_18](end_span)
            document.getElementById('uploadArea').onclick = () => document.getElementById('imageInput').click();
            document.getElementById('imageInput').onchange = (e) => {
                const file = e.target.files[0];
                if(file && file.size < 500000) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const base64 = ev.target.result.split(',')[1];
                        document.getElementById('imageData').value = base64;
                        document.getElementById('imagePreview').src = ev.target.result;
                        document.getElementById('imagePreview').style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                } else showNotification("Файл больше 500KB", "error");
            };

            [span_19](start_span)[span_20](start_span)// Редактирование[span_19](end_span)[span_20](end_span)
            window.editProduct = (id) => {
                const p = products.find(x => x.id === id);
                document.getElementById('productId').value = p.id;
                document.getElementById('productName').value = p.name;
                document.getElementById('productPrice').value = p.price;
                document.getElementById('productCategory').value = p.category;
                document.getElementById('productDescription').value = p.description || '';
                document.getElementById('variantBtnName').value = p.variantButtonName || '';
                currentVariants = p.variants ? [...p.variants] : [];
                document.getElementById('imageData').value = p.imageData;
                document.getElementById('imagePreview').src = "data:image/jpeg;base64," + p.imageData;
                document.getElementById('imagePreview').style.display = 'block';
                renderAdminVariants();
                document.getElementById('productModal').style.display = 'flex';
            };

            window.deleteProduct = (id) => { if(confirm("Удалить?")) db.ref('products/'+id).remove(); };

            // Управление окнами
            document.getElementById('adminIcon').onclick = () => {
                if(isAdmin) { 
                    isAdmin = false; 
                    document.getElementById('addProductButton').style.display='none'; 
                    renderProducts(); 
                } else document.getElementById('loginModal').style.display='flex';
            };

            document.getElementById('loginBtn').onclick = () => {
                if(document.getElementById('password').value === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('loginModal').style.display='none';
                    document.getElementById('addProductButton').style.display='block';
                    renderProducts();
                } else document.getElementById('loginMessage').style.display='block';
            };

            document.getElementById('showAddProductModal').onclick = () => {
                document.getElementById('productForm').reset();
                document.getElementById('productId').value = '';
                document.getElementById('imageData').value = '';
                document.getElementById('imagePreview').style.display = 'none';
                currentVariants = [];
                renderAdminVariants();
                document.getElementById('productModal').style.display='flex';
            };

            // Закрытие
            document.querySelectorAll('.close-btn').forEach(b => {
                b.onclick = () => b.closest('.modal-overlay').style.display = 'none';
            });

            loadProducts();
        });
    </script>
</body>
</html>
