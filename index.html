<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smokin174 | Premium Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-dark: #050505;
            --card-bg: #0f0f0f;
            --neon-green: #2bff00;
            --neon-gradient: linear-gradient(135deg, #2bff00 0%, #1eb300 100%);
            --text-gray: #a0a0a0;
            --shadow: 0 0 15px rgba(43, 255, 0, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; line-height: 1.6; overflow-x: hidden; }

        /* HEADER */
        header { 
            background: rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(43, 255, 0, 0.2); 
            padding: 1rem 0; position: sticky; top: 0; z-index: 1000; 
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; letter-spacing: 1px; }
        .logo span { color: var(--neon-green); text-shadow: 0 0 10px rgba(43, 255, 0, 0.5); }

        /* CATEGORIES */
        .categories-bar { background: #000; padding: 15px 0; position: sticky; top: 65px; z-index: 900; border-bottom: 1px solid #111; }
        .cat-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 20px; scrollbar-width: none; max-width: 1200px; margin: 0 auto; }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { 
            padding: 8px 20px; border-radius: 30px; background: #111; border: 1px solid #222; 
            color: var(--text-gray); cursor: pointer; white-space: nowrap; transition: 0.3s;
        }
        .cat-btn.active { background: var(--neon-gradient); color: #000; font-weight: 600; border-color: var(--neon-green); }

        /* GRID */
        .main-container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        @media (max-width: 600px) { .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }

        /* CARD */
        .card { 
            background: var(--card-bg); border-radius: 15px; border: 1px solid #1a1a1a; 
            overflow: hidden; display: flex; flex-direction: column; transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); border-color: rgba(43, 255, 0, 0.4); box-shadow: var(--shadow); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #000; }
        .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-title { font-size: 1rem; margin-bottom: 5px; font-weight: 500; }
        .card-price { font-size: 1.2rem; font-weight: 800; color: var(--neon-green); margin-bottom: 15px; }

        .btn-view { 
            background: rgba(43, 255, 0, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green);
            padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; margin-top: auto; transition: 0.3s;
        }
        .btn-view:hover { background: var(--neon-gradient); color: #000; }

        /* MODALS */
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 15px;
        }
        .modal { 
            background: #111; border: 1px solid #222; padding: 25px; border-radius: 20px; 
            width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; position: relative;
        }
        .modal-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { color: var(--text-gray); font-size: 1.5rem; cursor: pointer; }

        .variant-item { 
            background: #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 8px; 
            border-left: 3px solid var(--neon-green); font-size: 0.95rem;
        }

        /* ADMIN */
        .admin-badge { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
        .a-btn { width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer; color: #fff; }
        .form-input { 
            width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; 
            padding: 12px; border-radius: 10px; margin-bottom: 15px; 
        }
        .btn-submit { background: var(--neon-gradient); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; }

        .notification { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--neon-green); color: #000; padding: 10px 30px; border-radius: 50px; font-weight: bold; display: none; z-index: 3000; }
    </style>
</head>
<body>

<div id="toast" class="notification">Готово!</div>

<header>
    <div class="header-content">
        <a href="#" class="logo">SMOKIN<span>174</span></a>
        <div onclick="toggleAdminLogin()" style="cursor: pointer; color: var(--text-gray);"><i class="fas fa-user-shield"></i></div>
    </div>
</header>

<div class="categories-bar">
    <div class="cat-scroll" id="catList"></div>
</div>

<main class="main-container">
    <div class="products-grid" id="grid"></div>
    
    <div id="adminAddBtn" style="display:none; margin-top: 40px; text-align: center;">
        <button class="btn-submit" onclick="openProductModal()" style="width: auto; padding: 12px 40px;">+ Добавить товар</button>
    </div>
</main>

<div class="overlay" id="variantsOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2 id="vTitle" style="color: var(--neon-green);">Вкусы</h2>
            <span class="close-btn" onclick="closeModal('variantsOverlay')">&times;</span>
        </div>
        <div id="vList"></div>
    </div>
</div>

<div class="overlay" id="productOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2 id="mTitle">Товар</h2>
            <span class="close-btn" onclick="closeModal('productOverlay')">&times;</span>
        </div>
        <form id="pForm">
            <input type="hidden" id="pId">
            <input type="text" id="pName" placeholder="Название" class="form-input" required>
            <input type="number" id="pPrice" placeholder="Цена" class="form-input" required>
            <input type="text" id="pCat" placeholder="Категория" class="form-input" required>
            
            <div style="border: 1px solid #222; padding: 10px; border-radius: 10px; margin-bottom: 15px;">
                <p style="font-size: 0.8rem; color: var(--neon-green); margin-bottom: 5px;">Настройка кнопки (напр. "Вкусы")</p>
                <input type="text" id="pBtnName" placeholder="Вкусы" class="form-input" style="margin-bottom: 10px;">
                
                <p style="font-size: 0.8rem; margin-bottom: 5px;">Список подкатегорий</p>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="vInp" placeholder="Значение" class="form-input" style="margin-bottom:0">
                    <button type="button" onclick="addV()" class="btn-submit" style="width:50px;">+</button>
                </div>
                <div id="adminVList" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:5px;"></div>
            </div>

            <input type="file" id="fInp" accept="image/*" class="form-input">
            <input type="hidden" id="pImg">
            <button type="submit" class="btn-submit">СОХРАНИТЬ</button>
        </form>
    </div>
</div>

<div class="overlay" id="loginOverlay">
    <div class="modal" style="max-width: 300px;">
        <h2 style="margin-bottom: 15px;">Admin</h2>
        <input type="password" id="pass" class="form-input" placeholder="Пароль">
        <button onclick="tryLogin()" class="btn-submit">Войти</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD3wDw2ZTTXn2gY467grDOVi9E5vcusilc",
        authDomain: "alexsmok-1dc1c.firebaseapp.com",
        databaseURL: "https://alexsmok-1dc1c-default-rtdb.firebaseio.com",
        projectId: "alexsmok-1dc1c",
        appId: "1:173792761960:web:5bc84d324322edd58ac3dd"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let products = [];
    let curVariants = [];
    let isAdmin = false;
    let curCat = 'all';

    function load() {
        db.ref('products').on('value', snap => {
            const val = snap.val();
            products = val ? Object.keys(val).map(k => ({id:k, ...val[k]})) : [];
            render();
        });
    }

    function render() {
        // Категории
        const cats = ['all', ...new Set(products.map(p => p.category))];
        document.getElementById('catList').innerHTML = cats.map(c => `
            <button class="cat-btn ${curCat === c ? 'active' : ''}" onclick="setCat('${c}')">
                ${c === 'all' ? 'Все товары' : c}
            </button>
        `).join('');

        // Товары
        const filtered = curCat === 'all' ? products : products.filter(p => p.category === curCat);
        document.getElementById('grid').innerHTML = filtered.map(p => `
            <div class="card">
                ${isAdmin ? `
                    <div class="admin-badge">
                        <button class="a-btn" style="background:#007bff" onclick="editP('${p.id}')"><i class="fas fa-pen"></i></button>
                        <button class="a-btn" style="background:#dc3545" onclick="delP('${p.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                ` : ''}
                <img src="data:image/jpeg;base64,${p.imageData}" class="card-img">
                <div class="card-body">
                    <h3 class="card-title">${p.name}</h3>
                    <div class="card-price">${p.price} ₽</div>
                    ${p.variants && p.variants.length > 0 ? 
                        `<button class="btn-view" onclick="viewV('${p.id}')">${p.variantButtonName || 'Вкусы'} (${p.variants.length})</button>` : ''}
                </div>
            </div>
        `).join('');
    }

    window.setCat = (c) => { curCat = c; render(); };

    window.viewV = (id) => {
        const p = products.find(x => x.id === id);
        document.getElementById('vTitle').textContent = p.variantButtonName || 'Вкусы';
        document.getElementById('vList').innerHTML = p.variants.map(v => `<div class="variant-item">${v}</div>`).join('');
        document.getElementById('variantsOverlay').style.display = 'flex';
    };

    window.addV = () => {
        const v = document.getElementById('vInp').value.trim();
        if(v) { curVariants.push(v); document.getElementById('vInp').value = ''; renderAV(); }
    };

    function renderAV() {
        document.getElementById('adminVList').innerHTML = curVariants.map((v, i) => `
            <span style="background:#222; padding:5px 10px; border-radius:5px; font-size:0.8rem;">
                ${v} <i class="fas fa-times" onclick="curVariants.splice(${i},1);renderAV()" style="color:red; cursor:pointer; margin-left:5px"></i>
            </span>
        `).join('');
    }

    document.getElementById('pForm').onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('pId').value;
        const data = {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            category: document.getElementById('pCat').value,
            variantButtonName: document.getElementById('pBtnName').value || 'Вкусы',
            variants: curVariants,
            imageData: document.getElementById('pImg').value,
            updatedAt: Date.now()
        };
        if(!data.imageData) return alert('Загрузите фото!');
        id ? await db.ref('products/'+id).update(data) : await db.ref('products').push(data);
        closeModal('productOverlay');
        toast();
    };

    document.getElementById('fInp').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => document.getElementById('pImg').value = ev.target.result.split(',')[1];
        reader.readAsDataURL(e.target.files[0]);
    };

    window.editP = (id) => {
        const p = products.find(x => x.id === id);
        document.getElementById('pId').value = p.id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pCat').value = p.category;
        document.getElementById('pBtnName').value = p.variantButtonName || '';
        document.getElementById('pImg').value = p.imageData;
        curVariants = p.variants ? [...p.variants] : [];
        renderAV();
        document.getElementById('productOverlay').style.display = 'flex';
    };

    window.delP = (id) => { if(confirm('Удалить?')) db.ref('products/'+id).remove(); };

    window.toggleAdminLogin = () => {
        if(isAdmin) { isAdmin = false; document.getElementById('adminAddBtn').style.display='none'; render(); }
        else document.getElementById('loginOverlay').style.display='flex';
    };

    window.tryLogin = () => {
        if(document.getElementById('pass').value === 'smkn00') {
            isAdmin = true; closeModal('loginOverlay');
            document.getElementById('adminAddBtn').style.display='block'; render();
        } else alert('!');
    };

    window.openProductModal = () => {
        document.getElementById('pForm').reset();
        document.getElementById('pId').value = '';
        curVariants = []; renderAV();
        document.getElementById('productOverlay').style.display = 'flex';
    };

    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    function toast() {
        const t = document.getElementById('toast');
        t.style.display = 'block'; setTimeout(() => t.style.display='none', 2000);
    }

    load();
</script>
</body>
</html>
