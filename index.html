<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smokin174 | Магазин никотиновой продукции</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --success-color: #27ae60;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body { background-color: #f9f9f9; color: #333; }
        .container { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 20px; }

        /* Шапка */
        header { background-color: var(--primary-color); color: white; padding: 1rem 0; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 700; color: white; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .admin-icon { width: 45px; height: 45px; background: var(--secondary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* Категории */
        .categories { background: white; padding: 1rem 0; border-bottom: 1px solid #eee; position: sticky; top: 75px; z-index: 90; }
        .categories-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .category-btn { padding: 0.6rem 1.2rem; background: var(--light-color); border: none; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: 500; }
        .category-btn.active { background: var(--secondary-color); color: white; }

        /* Сетка товаров */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        @media (max-width: 600px) { .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; position: relative; }
        .product-image { width: 100%; height: 200px; object-fit: cover; }
        .product-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 1.1rem; margin-bottom: 8px; }
        .product-price { font-size: 1.2rem; font-weight: 700; color: var(--accent-color); margin-bottom: 12px; }

        /* Кнопка Вкусы/Подкатегории */
        .variants-btn { 
            background: #f1f3f5; border: 1px solid #dee2e6; padding: 8px; border-radius: 6px; 
            cursor: pointer; width: 100%; font-size: 0.9rem; margin-top: auto; transition: 0.2s;
        }
        .variants-btn:hover { background: #e9ecef; }

        /* Модальные окна */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* Списки вариантов в окне */
        .variants-view-list { display: grid; gap: 8px; margin-top: 15px; }
        .variant-pill { background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #eee; text-align: center; font-weight: 500; }

        /* Админка */
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; }
        .btn-primary { background: var(--secondary-color); color: white; }
        .admin-controls { position: absolute; top: 5px; right: 5px; display: flex; gap: 5px; }
        .edit-btn, .del-btn { width: 30px; height: 30px; border-radius: 50%; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="#" class="logo"><i class="fas fa-smoking"></i> Smokin174</a>
            <div class="admin-icon" id="adminIcon"><i class="fas fa-user-lock"></i></div>
        </div>
    </header>

    <div class="categories">
        <div class="container" id="categoriesContainer">
            </div>
    </div>

    <main class="container">
        <div class="products-grid" id="productsGrid"></div>
        <div id="adminPanel" style="display:none; margin: 40px 0; text-align: center;">
            <button class="btn btn-primary" id="openAddModal" style="width: auto;">+ Добавить новый товар</button>
        </div>
    </main>

    <div class="modal-overlay" id="clientVariantsModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="clientModalTitle">Выбор</h2>
                <button class="close-btn" onclick="closeModal('clientVariantsModal')">&times;</button>
            </div>
            <div id="clientVariantsList" class="variants-view-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <h2>Вход в админку</h2>
            <input type="password" id="adminPass" class="form-control" style="margin: 15px 0;">
            <button class="btn btn-primary" id="loginSubmit">Войти</button>
        </div>
    </div>

    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Товар</h2>
                <button class="close-btn" onclick="closeModal('productModal')">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="editId">
                <div class="form-group"><label>Название</label><input type="text" id="pName" class="form-control" required></div>
                <div class="form-group"><label>Цена</label><input type="number" id="pPrice" class="form-control" required></div>
                <div class="form-group"><label>Категория</label><input type="text" id="pCat" class="form-control" required></div>
                
                <div style="background: #f0f4f8; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                    <label><strong>Название кнопки</strong> (напр: "Вкусы" или "Крепость")</label>
                    <input type="text" id="pBtnName" class="form-control" placeholder="Вкусы" style="margin-bottom: 10px;">
                    
                    <label>Добавить вариант в список</label>
                    <div style="display:flex; gap:5px;">
                        <input type="text" id="variantInp" class="form-control" placeholder="Напр: Ледяная Мята">
                        <button type="button" id="addVarBtn" class="btn btn-primary" style="width:50px;">+</button>
                    </div>
                    <div id="adminVarsList" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:5px;"></div>
                </div>

                <div class="form-group">
                    <label>Фото (Base64)</label>
                    <input type="file" id="pImgFile" accept="image/*" class="form-control">
                    <input type="hidden" id="pImgBase64">
                </div>
                <button type="submit" class="btn btn-primary">Сохранить товар</button>
            </form>
        </div>
    </div>

    <script>
        // --- ЗАМЕНИТЕ НА ВАШИ ДАННЫЕ ИЗ ОРИГИНАЛЬНОГО ФАЙЛА ---
        const firebaseConfig = {
            apiKey: "AIzaSyD3wDw2ZTTXn2gY467grDOVi9E5vcusilc",
            authDomain: "alexsmok-1dc1c.firebaseapp.com",
            databaseURL: "https://alexsmok-1dc1c-default-rtdb.firebaseio.com",
            projectId: "alexsmok-1dc1c",
            storageBucket: "alexsmok-1dc1c.appspot.com",
            messagingSenderId: "173792761960",
            appId: "1:173792761960:web:5bc84d324322edd58ac3dd"
        };
        // -----------------------------------------------------

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let isAdmin = false;
        let allProducts = [];
        let tempVariants = [];
        let currentCategory = 'all';

        // Инициализация
        function init() {
            loadProducts();
            setupEventListeners();
        }

        function loadProducts() {
            db.ref('products').on('value', (snap) => {
                const data = snap.val();
                allProducts = data ? Object.keys(data).map(id => ({id, ...data[id]})) : [];
                renderCategories();
                renderProducts();
            });
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            const cats = ['all', ...new Set(allProducts.map(p => p.category))];
            container.innerHTML = cats.map(c => `
                <button class="category-btn ${currentCategory === c ? 'active' : ''}" 
                        onclick="setCategory('${c}')">${c === 'all' ? 'Все' : c}</button>
            `).join('');
        }

        window.setCategory = (c) => {
            currentCategory = c;
            renderCategories();
            renderProducts();
        };

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const filtered = currentCategory === 'all' ? allProducts : allProducts.filter(p => p.category === currentCategory);
            
            grid.innerHTML = filtered.map(p => {
                const btnName = p.variantButtonName || 'Выбрать вкус';
                const hasVariants = p.variants && p.variants.length > 0;
                
                return `
                    <div class="product-card">
                        ${isAdmin ? `
                            <div class="admin-controls">
                                <button class="edit-btn" style="background:#3498db" onclick="editProduct('${p.id}')"><i class="fas fa-edit"></i></button>
                                <button class="del-btn" style="background:#e74c3c" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        ` : ''}
                        <img src="${p.imageData.startsWith('data') ? p.imageData : 'data:image/jpeg;base64,' + p.imageData}" class="product-image">
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="product-price">${p.price} ₽</div>
                            ${hasVariants ? `<button class="variants-btn" onclick="openClientVariants('${p.id}')">${btnName} (${p.variants.length})</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Просмотр вкусов
        window.openClientVariants = (id) => {
            const p = allProducts.find(x => x.id === id);
            document.getElementById('clientModalTitle').textContent = p.variantButtonName || 'Варианты';
            const list = document.getElementById('clientVariantsList');
            list.innerHTML = p.variants.map(v => `<div class="variant-pill">${v}</div>`).join('');
            document.getElementById('clientVariantsModal').style.display = 'flex';
        };

        // Админка: Добавление вариантов
        document.getElementById('addVarBtn').onclick = () => {
            const val = document.getElementById('variantInp').value.trim();
            if(val) {
                tempVariants.push(val);
                document.getElementById('variantInp').value = '';
                renderAdminVars();
            }
        };

        function renderAdminVars() {
            const container = document.getElementById('adminVarsList');
            container.innerHTML = tempVariants.map((v, i) => `
                <span class="variant-pill" style="padding: 5px 10px; font-size: 0.8rem;">
                    ${v} <i class="fas fa-times" style="color:red; cursor:pointer" onclick="removeVar(${i})"></i>
                </span>
            `).join('');
        }
        window.removeVar = (i) => { tempVariants.splice(i, 1); renderAdminVars(); };

        // Сохранение
        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const productData = {
                name: document.getElementById('pName').value,
                price: document.getElementById('pPrice').value,
                category: document.getElementById('pCat').value,
                variantButtonName: document.getElementById('pBtnName').value || 'Вкусы',
                variants: tempVariants,
                imageData: document.getElementById('pImgBase64').value,
                updatedAt: Date.now()
            };

            if(!productData.imageData) return alert("Загрузите фото!");

            if(id) await db.ref('products/' + id).update(productData);
            else await db.ref('products').push(productData);
            
            closeModal('productModal');
        };

        // Вспомогательные функции
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        function setupEventListeners() {
            // Вход
            document.getElementById('adminIcon').onclick = () => {
                if(!isAdmin) document.getElementById('loginModal').style.display = 'flex';
                else { isAdmin = false; document.getElementById('adminPanel').style.display='none'; renderProducts(); }
            };

            document.getElementById('loginSubmit').onclick = () => {
                if(document.getElementById('adminPass').value === 'smkn00') {
                    isAdmin = true;
                    closeModal('loginModal');
                    document.getElementById('adminPanel').style.display='block';
                    renderProducts();
                } else alert('Неверно!');
            };

            document.getElementById('openAddModal').onclick = () => {
                document.getElementById('productForm').reset();
                document.getElementById('editId').value = '';
                document.getElementById('pImgBase64').value = '';
                tempVariants = [];
                renderAdminVars();
                document.getElementById('productModal').style.display = 'flex';
            };

            // Обработка фото
            document.getElementById('pImgFile').onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (ev) => document.getElementById('pImgBase64').value = ev.target.result;
                reader.readAsDataURL(e.target.files[0]);
            };
        }

        window.editProduct = (id) => {
            const p = allProducts.find(x => x.id === id);
            document.getElementById('editId').value = p.id;
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pCat').value = p.category;
            document.getElementById('pBtnName').value = p.variantButtonName || '';
            document.getElementById('pImgBase64').value = p.imageData;
            tempVariants = p.variants ? [...p.variants] : [];
            renderAdminVars();
            document.getElementById('productModal').style.display = 'flex';
        };

        window.deleteProduct = (id) => { if(confirm('Удалить товар?')) db.ref('products/' + id).remove(); };

        init();
    </script>
</body>
</html>
