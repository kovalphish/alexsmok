<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smokin174 | Магазин никотиновой продукции</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        :root {
            --primary-color: #000000; /* Черный из логотипа */
            --secondary-color: #2bff00; /* Ярко-зеленый из логотипа */
            --accent-color: #ff3333;
            --light-color: #1a1a1a;
            --text-white: #ffffff;
            --shadow: 0 4px 15px rgba(43, 255, 0, 0.2);
            --transition: all 0.3s ease;
        }

        body { background-color: #0a0a0a; color: #eee; line-height: 1.6; }
        .container { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 20px; }

        header { background-color: var(--primary-color); border-bottom: 2px solid var(--secondary-color); color: white; padding: 1rem 0; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 700; color: var(--secondary-color); text-decoration: none; display: flex; align-items: center; gap: 10px; text-shadow: 0 0 10px rgba(43, 255, 0, 0.5); }

        .admin-icon { background-color: var(--secondary-color); color: black; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); }

        /* Категории */
        .categories { background-color: #111; padding: 1.2rem 0; border-bottom: 1px solid #222; position: sticky; top: 75px; z-index: 99; }
        .categories-container { display: flex; overflow-x: auto; gap: 10px; scrollbar-width: none; }
        .category-btn { padding: 0.6rem 1.5rem; background-color: #222; border: 1px solid #333; color: #ccc; border-radius: 25px; cursor: pointer; white-space: nowrap; transition: var(--transition); }
        .category-btn.active { background-color: var(--secondary-color); color: black; font-weight: bold; border-color: var(--secondary-color); }

        /* Сетка товаров */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        @media (max-width: 768px) { .products-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; } }

        .product-card { background-color: #151515; border: 1px solid #222; border-radius: 12px; overflow: hidden; transition: var(--transition); position: relative; display: flex; flex-direction: column; height: 100%; }
        .product-card:hover { border-color: var(--secondary-color); transform: translateY(-5px); box-shadow: var(--shadow); }
        .product-image { width: 100%; height: 200px; object-fit: cover; background-color: #000; }
        .product-info { padding: 1.2rem; flex-grow: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 1.1rem; color: #fff; margin-bottom: 0.5rem; }
        .product-price { font-size: 1.3rem; font-weight: 700; color: var(--secondary-color); margin-bottom: 1rem; }

        /* Кнопка вариантов */
        .show-variants-btn { 
            background: transparent; border: 1px solid var(--secondary-color); color: var(--secondary-color); 
            padding: 0.6rem; border-radius: 6px; cursor: pointer; font-weight: 600; transition: var(--transition); width: 100%;
        }
        .show-variants-btn:hover { background: var(--secondary-color); color: black; }

        /* Модальные окна */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: #151515; border: 1px solid var(--secondary-color); border-radius: 15px; width: 90%; max-width: 450px; padding: 2rem; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem; }
        .close-btn { background: none; border: none; font-size: 1.8rem; color: #666; cursor: pointer; }
        .close-btn:hover { color: var(--secondary-color); }

        /* Список вкусов в окне */
        .variants-list-full { display: grid; gap: 10px; margin-top: 10px; }
        .variant-item-full { background: #222; padding: 12px; border-radius: 8px; border-left: 4px solid var(--secondary-color); color: #fff; }

        /* Админка */
        .form-group { margin-bottom: 1.2rem; }
        .form-control { width: 100%; padding: 0.8rem; background: #222; border: 1px solid #333; color: white; border-radius: 6px; }
        .btn-success { background: var(--secondary-color); color: black; border: none; padding: 0.8rem; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        
        .notification { position: fixed; top: 20px; right: 20px; background: var(--secondary-color); color: black; padding: 1rem 2rem; border-radius: 8px; display: none; z-index: 2000; font-weight: bold; }
    </style>
</head>
<body>
    <div class="notification" id="notification"></div>

    <header>
        <div class="container header-content">
            <a href="#" class="logo"><i class="fas fa-smoking"></i> Smokin174</a>
            <div class="admin-icon" id="adminIcon"><i class="fas fa-user-lock"></i></div>
        </div>
    </header>

    <section class="categories">
        <div class="container" id="categoriesContainer"></div>
    </section>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin: 2rem 0;">
            <h1 id="categoryTitle" style="color: var(--secondary-color)">Загрузка...</h1>
            <p id="productsCount"></p>
        </div>

        <div class="products-grid" id="productsGrid"></div>

        <div id="addProductButton" style="display: none; text-align: center; margin-bottom: 3rem;">
            <button class="btn-success" id="showAddModal" style="width: auto; padding: 1rem 2.5rem;">+ Добавить новый товар</button>
        </div>
    </main>

    <div class="modal-overlay" id="variantsViewModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="variantsViewTitle" style="color: var(--secondary-color)">Доступные варианты</h2>
                <button class="close-btn" onclick="closeModal('variantsViewModal')">&times;</button>
            </div>
            <div id="variantsViewList" class="variants-list-full"></div>
        </div>
    </div>

    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle" style="color: var(--secondary-color)">Товар</h2>
                <button class="close-btn" onclick="closeModal('productModal')">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="editId">
                <div class="form-group"><label>Название</label><input type="text" id="pName" class="form-control" required></div>
                <div class="form-group"><label>Цена (₽)</label><input type="number" id="pPrice" class="form-control" required></div>
                <div class="form-group"><label>Категория</label><input type="text" id="pCat" class="form-control" required></div>
                
                <div style="background: #111; padding: 15px; border-radius: 10px; border: 1px solid #333; margin-bottom: 15px;">
                    <label style="color: var(--secondary-color)">Настройка кнопки подкатегорий</label>
                    <input type="text" id="pBtnName" class="form-control" placeholder="Напр: Вкусы, Цвета или Крепость" style="margin-bottom: 10px;">
                    
                    <label>Добавить вариант в список</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="varInput" class="form-control" placeholder="Напр: Ледяная мята">
                        <button type="button" id="addVarBtn" class="btn-success" style="width: 50px;">+</button>
                    </div>
                    <div id="adminVarsList" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px;"></div>
                </div>

                <div class="form-group">
                    <label>Изображение</label>
                    <input type="file" id="imageInput" accept="image/*" class="form-control">
                    <input type="hidden" id="pImgBase64">
                </div>
                <button type="submit" class="btn-success">СОХРАНИТЬ ТОВАР</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal" style="max-width: 320px;">
            <h2 style="margin-bottom: 1rem; color: var(--secondary-color)">Admin Access</h2>
            <input type="password" id="adminPass" class="form-control" placeholder="Пароль">
            <button class="btn-success" id="loginBtn" style="margin-top: 1rem;">ВОЙТИ</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD3wDw2ZTTXn2gY467grDOVi9E5vcusilc",
            authDomain: "alexsmok-1dc1c.firebaseapp.com",
            databaseURL: "https://alexsmok-1dc1c-default-rtdb.firebaseio.com",
            projectId: "alexsmok-1dc1c",
            messagingSenderId: "173792761960",
            appId: "1:173792761960:web:5bc84d324322edd58ac3dd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let products = [];
        let variants = [];
        let isAdmin = false;
        let currentCategory = 'all';

        function showNotification(msg) {
            const n = document.getElementById('notification');
            n.textContent = msg; n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 3000);
        }

        function loadProducts() {
            db.ref('products').on('value', (snap) => {
                const data = snap.val();
                products = data ? Object.keys(data).map(key => ({id: key, ...data[key]})) : [];
                renderCategories();
                renderProducts();
            });
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            const cats = new Set(products.map(p => p.category));
            container.innerHTML = `<button class="category-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="setCat('all')">Все товары</button>`;
            Array.from(cats).sort().forEach(c => {
                container.innerHTML += `<button class="category-btn ${currentCategory === c ? 'active' : ''}" onclick="setCat('${c}')">${c}</button>`;
            });
        }

        window.setCat = (c) => { currentCategory = c; renderCategories(); renderProducts(); };

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const filtered = currentCategory === 'all' ? products : products.filter(p => p.category === currentCategory);
            
            document.getElementById('categoryTitle').textContent = currentCategory === 'all' ? 'Все товары' : currentCategory;
            document.getElementById('productsCount').textContent = `Товаров: ${filtered.length}`;
            grid.innerHTML = '';

            filtered.sort((a,b) => (b.updatedAt || 0) - (a.updatedAt || 0)).forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                [span_1](start_span)const btnText = p.variantButtonName || 'Выбрать вкус';[span_1](end_span)
                const variantsBtn = (p.variants && p.variants.length > 0) 
                    ? [span_2](start_span)`<button class="show-variants-btn" onclick="openVariantsView('${p.id}')">${btnText} (${p.variants.length})</button>`[span_2](end_span)
                    : '';

                card.innerHTML = `
                    ${isAdmin ? `<div style="position:absolute; top:10px; right:10px; z-index:5; display:flex; gap:5px;">
                        <button onclick="editProduct('${p.id}')" style="background:var(--secondary-color); border:none; width:30px; height:30px; border-radius:50%; cursor:pointer;"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteProduct('${p.id}')" style="background:var(--accent-color); color:white; border:none; width:30px; height:30px; border-radius:50%; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </div>` : ''}
                    <img src="data:image/jpeg;base64,${p.imageData}" class="product-image">
                    <div class="product-info">
                        <h3 class="product-title">${p.name}</h3>
                        <div class="product-price">${p.price} ₽</div>
                        <div style="margin-top:auto">${variantsBtn}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // КЛИЕНТ: Открытие списка вкусов
        window.openVariantsView = (id) => {
            const p = products.find(x => x.id === id);
            document.getElementById('variantsViewTitle').textContent = p.variantButtonName || 'Доступные вкусы';
            const list = document.getElementById('variantsViewList');
            [span_3](start_span)list.innerHTML = p.variants.map(v => `<div class="variant-item-full">${v.value}</div>`).join('');[span_3](end_span)
            document.getElementById('variantsViewModal').style.display = 'flex';
        };

        // АДМИН: Работа с вариантами
        document.getElementById('addVarBtn').onclick = () => {
            const val = document.getElementById('varInput').value.trim();
            if(val) {
                variants.push({ value: val });
                document.getElementById('varInput').value = '';
                renderAdminVars();
            }
        };

        function renderAdminVars() {
            const container = document.getElementById('adminVarsList');
            container.innerHTML = '';
            variants.forEach((v, i) => {
                const span = document.createElement('span');
                span.style.cssText = "background:#222; padding:5px 10px; border-radius:5px; border:1px solid #444; font-size:0.85rem;";
                span.innerHTML = `${v.value} <i class="fas fa-times" onclick="removeVar(${i})" style="color:red; cursor:pointer; margin-left:5px"></i>`;
                container.appendChild(span);
            });
        }
        window.removeVar = (i) => { variants.splice(i, 1); renderAdminVars(); };

        // АДМИН: Сохранение
        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                name: document.getElementById('pName').value,
                price: Number(document.getElementById('pPrice').value),
                category: document.getElementById('pCat').value,
                [span_4](start_span)variantButtonName: document.getElementById('pBtnName').value,[span_4](end_span)
                variants: [...variants],
                imageData: document.getElementById('pImgBase64').value,
                updatedAt: Date.now()
            };

            if(id) await db.ref('products/' + id).update(data);
            else { data.createdAt = Date.now(); await db.ref('products').push(data); }
            
            closeModal('productModal');
            showNotification('Готово!');
        };

        // Обработка фото
        document.getElementById('imageInput').onchange = (e) => {
            const file = e.target.files[0];
            if(file.size > 500000) return alert("Файл слишком большой!");
            const reader = new FileReader();
            reader.onload = (ev) => document.getElementById('pImgBase64').value = ev.target.result.split(',')[1];
            reader.readAsDataURL(file);
        };

        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        // Инициализация событий
        document.getElementById('adminIcon').onclick = () => {
            if(isAdmin) { isAdmin = false; document.getElementById('addProductButton').style.display='none'; renderProducts(); }
            else document.getElementById('loginModal').style.display='flex';
        };

        document.getElementById('loginBtn').onclick = () => {
            [span_5](start_span)if(document.getElementById('adminPass').value === 'smkn00') {[span_5](end_span)
                isAdmin = true;
                closeModal('loginModal');
                document.getElementById('addProductButton').style.display = 'block';
                renderProducts();
            } else alert('Неверный пароль');
        };

        document.getElementById('showAddModal').onclick = () => {
            document.getElementById('productForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('pImgBase64').value = '';
            variants = [];
            renderAdminVars();
            document.getElementById('modalTitle').textContent = 'Добавить товар';
            document.getElementById('productModal').style.display = 'flex';
        };

        window.editProduct = (id) => {
            const p = products.find(x => x.id === id);
            document.getElementById('editId').value = p.id;
            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pCat').value = p.category;
            document.getElementById('pBtnName').value = p.variantButtonName || [span_6](start_span)'';[span_6](end_span)
            document.getElementById('pImgBase64').value = p.imageData;
            variants = p.variants ? [...p.variants] : [];
            renderAdminVars();
            document.getElementById('modalTitle').textContent = 'Редактировать товар';
            document.getElementById('productModal').style.display = 'flex';
        };

        window.deleteProduct = (id) => { if(confirm('Удалить товар?')) db.ref('products/'+id).remove(); };

        loadProducts();
    </script>
</body>
</html>
