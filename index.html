<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smokin174 | Premium Price</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-black: #050505;
            --neon-green: #2bff00;
            --neon-blue: #0088cc;
            --neon-border: rgba(43, 255, 0, 0.3);
            --glass: rgba(15, 15, 15, 0.85);
            --gray-btn: ##636363; /* Тот самый серый цвет */
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-black); color: #fff; line-height: 1.5; overflow-x: hidden; min-height: 100vh; }

        /* АНИМИРОВАННЫЙ ФОН */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .circle { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(43, 255, 0, 0.08) 0%, rgba(0,0,0,0) 70%); animation: move 25s infinite alternate ease-in-out; }
        @keyframes move { 0% { transform: translate(0, 0); } 100% { transform: translate(100px, 80px); } }

        /* ШАПКА */
        header { 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--neon-border); 
            padding: 0.6rem 0; position: sticky; top: 0; z-index: 1000; overflow: hidden;
        }
        header::before { content: ""; position: absolute; top: -30px; left: -30px; width: 100px; height: 100px; background: radial-gradient(circle, rgba(43, 255, 0, 0.15) 0%, transparent 70%); pointer-events: none; }

        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 15px; position: relative; z-index: 2; }
        .logo-block { display: flex; align-items: center; gap: 10px; }
        .main-logo { height: 38px; width: auto; border-radius: 8px; }
        .price-label { font-size: 1.2rem; font-weight: 900; color: var(--neon-green); text-transform: uppercase; letter-spacing: 1px; }

        .nav-icons { display: flex; align-items: center; gap: 12px; }
        
        /* КНОПКА МЕНЕДЖЕРА СЕРАЯ */
        .btn-manager {
            background: var(--gray-btn);
            color: #000 !important;
            padding: 7px 15px;
            border-radius: 10px; /* Сделал чуть менее закругленным для стиля */
            font-size: 0.75rem;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            transition: var(--transition);
        }
        .btn-manager:hover { background: #d0d0d0; transform: translateY(-1px); }

        .tg-icon { color: #fff; opacity: 0.8; transition: var(--transition); }
        .tg-icon:hover { color: var(--neon-blue); opacity: 1; }

        /* КАТЕГОРИИ */
        .cat-bar { background: rgba(0,0,0,0.2); padding: 12px 0; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #111; }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-container { display: flex; gap: 8px; padding: 0 15px; }
        .cat-link { padding: 8px 16px; border-radius: 12px; background: #111; border: 1px solid #222; color: #777; cursor: pointer; font-size: 0.8rem; transition: var(--transition); }
        .cat-link.active { background: var(--neon-green); color: #000; font-weight: bold; border-color: var(--neon-green); }

        /* СЕТКА ТОВАРОВ */
        .main { max-width: 1200px; margin: 15px auto; padding: 0 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; } }

        /* КАРТОЧКА */
        .card { background: var(--glass); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; display: flex; flex-direction: column; height: 100%; transition: var(--transition); position: relative; animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #000; }
        .card-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-name { font-size: 0.9rem; margin-bottom: 5px; display: block; color: #eee; }
        .card-price { font-size: 1.1rem; font-weight: 800; color: var(--neon-green); }
        .btn-variants { background: rgba(43, 255, 0, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); padding: 10px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.75rem; width: 100%; margin-top: 10px; }

        /* SKELETON ANIMATION */
        .skeleton { background: #111; height: 250px; border-radius: 15px; position: relative; overflow: hidden; }
        .skeleton::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: loading 1.5s infinite; }
        @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* MODALS */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; opacity: 0; transition: 0.3s; }
        .overlay.active { display: flex; opacity: 1; }
        .modal { background: #0a0a0a; border: 1px solid var(--neon-border); padding: 20px; border-radius: 20px; width: 92%; max-width: 400px; position: relative; }
        .modal-scroll { max-height: 60vh; overflow-y: auto; }
        .inp { width: 100%; background: #151515; border: 1px solid #222; color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 10px; outline: none; }
        .btn-main { background: var(--neon-green); color: #000; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="bg-animation" id="bgAnim"></div>

<header>
    <div class="header-content">
        <div class="logo-block">
            <img src="logo.jpg" alt="Logo" class="main-logo" onerror="this.style.display='none'">
            <div class="price-label">ПРАЙС</div>
        </div>
        <div class="nav-icons">
            <a href="https://t.me/smokinshop174" target="_blank" class="btn-manager">Менеджер</a>
            <a href="https://t.me/smokin174" target="_blank" class="tg-icon"><i class="fab fa-telegram fa-lg"></i></a>
            <div onclick="openModal('loginOverlay')" style="cursor:pointer; opacity: 0.05;"><i class="fas fa-fingerprint fa-lg"></i></div>
        </div>
    </div>
</header>

<div class="cat-bar">
    <div class="cat-container" id="cats"></div>
</div>

<main class="main">
    <div class="grid" id="productGrid">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
    </div>
    
    <div id="adminArea" style="display:none; text-align:center; margin-top:20px;">
        <button class="btn-main" onclick="openAdd()" style="width:auto; padding:12px 30px;">+ ДОБАВИТЬ ТОВАР</button>
    </div>
</main>

<div class="overlay" id="vOverlay" onclick="closeModal('vOverlay')">
    <div class="modal" onclick="event.stopPropagation()">
        <h2 id="vTitle" style="color:var(--neon-green); margin-bottom:15px; font-size: 1.2rem;">Вкусы</h2>
        <div id="vList" class="modal-scroll"></div>
        <button class="btn-main" style="margin-top:15px; background:#222; color:#fff;" onclick="closeModal('vOverlay')">Закрыть</button>
    </div>
</div>

<div class="overlay" id="pOverlay" onclick="closeModal('pOverlay')">
    <div class="modal" onclick="event.stopPropagation()">
        <form id="pForm">
            <input type="hidden" id="pId">
            <input type="text" id="pName" placeholder="Название" class="inp" required>
            <input type="number" id="pPrice" placeholder="Цена" class="inp" required>
            <input type="text" id="pCat" placeholder="Категория" class="inp" required>
            <input type="text" id="pBtnName" placeholder="Текст кнопки (Вкусы)" class="inp">
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <input type="text" id="vInp" class="inp" placeholder="Добавить вкус" style="margin-bottom:0">
                <button type="button" onclick="addV()" class="btn-main" style="width:50px;">+</button>
            </div>
            <div id="adminVList" style="margin-bottom:10px; display:flex; flex-wrap:wrap; gap:5px;"></div>
            <input type="file" id="fInp" class="inp">
            <input type="hidden" id="pImg">
            <button type="submit" class="btn-main">СОХРАНИТЬ</button>
        </form>
    </div>
</div>

<div class="overlay" id="loginOverlay" onclick="closeModal('loginOverlay')">
    <div class="modal" style="max-width:300px;" onclick="event.stopPropagation()">
        <input type="password" id="pass" class="inp" placeholder="Пароль">
        <button onclick="tryLogin()" class="btn-main">ВОЙТИ</button>
    </div>
</div>

<script>
    // Конфиг Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyD3wDw2ZTTXn2gY467grDOVi9E5vcusilc",
        authDomain: "alexsmok-1dc1c.firebaseapp.com",
        databaseURL: "https://alexsmok-1dc1c-default-rtdb.firebaseio.com",
        projectId: "alexsmok-1dc1c",
        appId: "1:173792761960:web:5bc84d324322edd58ac3dd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let products = [], curVariants = [], isAdmin = false, curCat = 'all';

    // Загрузка данных
    function load() {
        db.ref('products').on('value', snap => {
            const val = snap.val();
            products = val ? Object.keys(val).map(k => ({id:k, ...val[k]})) : [];
            render();
        }, (err) => {
            console.error("Ошибка Firebase:", err);
            document.getElementById('productGrid').innerHTML = "<p>Ошибка загрузки данных</p>";
        });
    }

    // Отрисовка
    function render() {
        // Категории
        const cats = ['all', ...new Set(products.map(p => p.category))];
        document.getElementById('cats').innerHTML = cats.map(c => `
            <div class="cat-link ${curCat === c ? 'active' : ''}" onclick="setCat('${c}')">
                ${c === 'all' ? 'Все' : c}
            </div>
        `).join('');

        const filtered = curCat === 'all' ? products : products.filter(p => p.category === curCat);
        const grid = document.getElementById('productGrid');

        if (filtered.length === 0 && products.length > 0) {
            grid.innerHTML = "<p style='grid-column:1/-1; text-align:center; opacity:0.5;'>В этой категории пусто</p>";
            return;
        }

        grid.innerHTML = filtered.map(p => {
            const img = p.imageData ? (p.imageData.startsWith('data') ? p.imageData : `data:image/jpeg;base64,${p.imageData}`) : '';
            return `
                <div class="card">
                    ${isAdmin ? `
                        <div style="position:absolute; top:5px; right:5px; z-index:10; display:flex; gap:5px;">
                            <button onclick="editP('${p.id}')" style="background:var(--neon-green); border:none; width:28px; height:28px; border-radius:50%;"><i class="fas fa-edit"></i></button>
                            <button onclick="delP('${p.id}')" style="background:#ff4444; color:#fff; border:none; width:28px; height:28px; border-radius:50%;"><i class="fas fa-trash"></i></button>
                        </div>
                    ` : ''}
                    <img src="${img}" class="card-img" onerror="this.src='https://via.placeholder.com/200?text=No+Photo'">
                    <div class="card-info">
                        <div>
                            <span class="card-name">${p.name}</span>
                            <div class="card-price">${p.price} ₽</div>
                        </div>
                        ${p.variants && p.variants.length > 0 ? `
                            <button class="btn-variants" onclick="openV('${p.id}')">
                                ${p.variantButtonName || 'Вкусы'} (${p.variants.length})
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    // Функции управления
    window.setCat = (c) => { curCat = c; render(); };
    window.openModal = (id) => { const el = document.getElementById(id); el.style.display = 'flex'; setTimeout(() => el.classList.add('active'), 10); };
    window.closeModal = (id) => { const el = document.getElementById(id); el.classList.remove('active'); setTimeout(() => el.style.display = 'none', 300); };
    
    window.openV = (id) => {
        const p = products.find(x => x.id === id);
        document.getElementById('vTitle').innerText = p.variantButtonName || 'Вкусы';
        document.getElementById('vList').innerHTML = p.variants.map(v => `
            <div style="background:#111; padding:12px; border-radius:10px; margin-bottom:8px; border-left:3px solid var(--neon-green); font-size:0.9rem;">${v}</div>
        `).join('');
        openModal('vOverlay');
    };

    window.addV = () => {
        const v = document.getElementById('vInp').value.trim();
        if(v) { curVariants.push(v); document.getElementById('vInp').value = ''; renderAV(); }
    };

    function renderAV() {
        document.getElementById('adminVList').innerHTML = curVariants.map((v, i) => `
            <span style="background:#222; padding:5px 10px; border-radius:8px; font-size:0.7rem;">
                ${v} <i class="fas fa-times" onclick="curVariants.splice(${i},1);renderAV()" style="color:red; margin-left:5px;"></i>
            </span>
        `).join('');
    }

    // Админ-функции
    window.tryLogin = () => {
        if(document.getElementById('pass').value === 'smkn00') {
            isAdmin = true; closeModal('loginOverlay');
            document.getElementById('adminArea').style.display = 'block'; render();
        } else { alert('Неверно'); }
    };

    window.openAdd = () => {
        document.getElementById('pForm').reset();
        document.getElementById('pId').value = '';
        curVariants = []; renderAV();
        openModal('pOverlay');
    };

    window.editP = (id) => {
        const p = products.find(x => x.id === id);
        document.getElementById('pId').value = p.id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pCat').value = p.category;
        document.getElementById('pBtnName').value = p.variantButtonName || '';
        document.getElementById('pImg').value = p.imageData || '';
        curVariants = p.variants ? [...p.variants] : [];
        renderAV(); openModal('pOverlay');
    };

    window.delP = (id) => { if(confirm('Удалить товар?')) db.ref('products/'+id).remove(); };

    document.getElementById('pForm').onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('pId').value;
        const data = {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            category: document.getElementById('pCat').value,
            variantButtonName: document.getElementById('pBtnName').value || 'Вкусы',
            variants: curVariants,
            imageData: document.getElementById('pImg').value,
            updatedAt: Date.now()
        };
        id ? await db.ref('products/'+id).update(data) : await db.ref('products').push(data);
        closeModal('pOverlay');
    };

    document.getElementById('fInp').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => document.getElementById('pImg').value = ev.target.result;
        reader.readAsDataURL(e.target.files[0]);
    };

    // Круги фона
    const bg = document.getElementById('bgAnim');
    for(let i=0; i<6; i++) {
        const c = document.createElement('div');
        c.className = 'circle';
        const size = Math.random() * 150 + 150;
        c.style.width = size + 'px'; c.style.height = size + 'px';
        c.style.left = Math.random() * 100 + '%'; c.style.top = Math.random() * 100 + '%';
        bg.appendChild(c);
    }

    load();
</script>
</body>
</html>
