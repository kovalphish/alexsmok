<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smokin174 | Premium Price</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-black: #050505;
            --neon-green: #2bff00;
            --neon-border: rgba(43, 255, 0, 0.3);
            --glass: rgba(15, 15, 15, 0.85);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            background-color: var(--bg-black); 
            color: #fff; 
            line-height: 1.6; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* АНИМИРОВАННЫЙ ФОН */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        .circle {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(43, 255, 0, 0.15) 0%, rgba(0,0,0,0) 70%);
            animation: move 20s infinite linear;
        }
        @keyframes move {
            0% { transform: translate(0, 0); }
            50% { transform: translate(100px, 50px); }
            100% { transform: translate(0, 0); }
        }

        /* ШАПКА */
        header { 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--neon-border);
            padding: 0.8rem 0; position: sticky; top: 0; z-index: 1000;
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .logo-block { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .main-logo { height: 45px; width: auto; transition: var(--transition); }
        .main-logo:hover { filter: drop-shadow(0 0 10px var(--neon-green)); }
        .price-label { font-size: 1.6rem; font-weight: 900; color: var(--neon-green); letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px var(--neon-green); }

        /* КАТЕГОРИИ */
        .cat-bar { background: rgba(0,0,0,0.5); padding: 15px 0; overflow-x: auto; white-space: nowrap; }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 12px; }
        .cat-link { 
            padding: 10px 22px; border-radius: 30px; background: #111; border: 1px solid #222;
            color: #888; cursor: pointer; transition: var(--transition); font-size: 0.9rem;
        }
        .cat-link.active { background: var(--neon-green); color: #000; font-weight: bold; transform: scale(1.05); }

        /* ТОВАРЫ */
        .main { max-width: 1200px; margin: 25px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }

        .card { 
            background: var(--glass); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden; display: flex; flex-direction: column; transition: var(--transition); position: relative;
            animation: fadeIn 0.6s ease-out forwards;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card:hover { border-color: var(--neon-green); transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .card-img { width: 100%; height: 240px; object-fit: cover; transition: 0.5s; }
        .card:hover .card-img { transform: scale(1.05); }
        .card-info { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-price { font-size: 1.4rem; font-weight: 800; color: var(--neon-green); margin-bottom: 12px; }

        .btn-variants {
            background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green);
            padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: var(--transition);
        }
        .btn-variants:hover { background: var(--neon-green); color: #000; }

        /* МОДАЛЬНЫЕ ОКНА */
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 2000; 
            opacity: 0; transition: opacity 0.3s ease;
        }
        .overlay.active { display: flex; opacity: 1; }
        
        .modal { 
            background: #0a0a0a; border: 1px solid var(--neon-border); padding: 30px; 
            border-radius: 28px; width: 92%; max-width: 450px; position: relative;
            transform: translateY(-50px) scale(0.9); transition: var(--transition);
        }
        .overlay.active .modal { transform: translateY(0) scale(1); }

        .close-modal {
            position: absolute; top: 20px; right: 20px; width: 35px; height: 35px;
            background: #1a1a1a; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; cursor: pointer; color: #666; transition: 0.3s;
        }
        .close-modal:hover { background: #ff4444; color: #fff; transform: rotate(90deg); }

        .v-item { background: #111; padding: 14px; border-radius: 14px; margin-bottom: 10px; border-left: 4px solid var(--neon-green); }

        /* АДМИНКА */
        .inp { width: 100%; background: #151515; border: 1px solid #222; color: #fff; padding: 14px; border-radius: 15px; margin-bottom: 15px; outline: none; }
        .inp:focus { border-color: var(--neon-green); }
        .btn-main { background: var(--neon-green); color: #000; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-main:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(43, 255, 0, 0.4); }
    </style>
</head>
<body>

<div class="bg-animation" id="bgAnim"></div>

<header>
    <div class="header-content">
        <div class="logo-block">
            <img src="logo.jpg" alt="Logo" class="main-logo" onerror="this.style.display='none'">
            <div class="price-label">Прайс</div>
        </div>
        <div onclick="openModal('loginOverlay')" style="cursor:pointer; color: #444;"><i class="fas fa-fingerprint fa-lg"></i></div>
    </div>
</header>

<div class="cat-bar">
    <div class="cat-container" id="cats"></div>
</div>

<main class="main">
    <div class="grid" id="productGrid"></div>
    <div id="adminArea" style="display:none; text-align:center; margin-top:40px;">
        <button class="btn-main" onclick="openAdd()" style="width:auto; padding:15px 50px;">+ ДОБАВИТЬ ТОВАР</button>
    </div>
</main>

<div class="overlay" id="vOverlay" onclick="closeModal('vOverlay')">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="close-modal" onclick="closeModal('vOverlay')"><i class="fas fa-times"></i></div>
        <h2 id="vTitle" style="color:var(--neon-green); margin-bottom:20px;">Вкусы</h2>
        <div id="vList" style="max-height: 60vh; overflow-y: auto; padding-right: 5px;"></div>
    </div>
</div>

<div class="overlay" id="pOverlay" onclick="closeModal('pOverlay')">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="close-modal" onclick="closeModal('pOverlay')"><i class="fas fa-times"></i></div>
        <h2 id="mTitle" style="color:var(--neon-green); margin-bottom:20px;">Товар</h2>
        <form id="pForm">
            <input type="hidden" id="pId">
            <input type="text" id="pName" placeholder="Название товара" class="inp" required>
            <input type="number" id="pPrice" placeholder="Цена (₽)" class="inp" required>
            <input type="text" id="pCat" placeholder="Категория" class="inp" required>
            
            <div style="background: #000; padding: 18px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #222;">
                <p style="color:var(--neon-green); font-size:0.85rem; margin-bottom:8px;">Название кнопки (напр. "Вкусы")</p>
                <input type="text" id="pBtnName" placeholder="Вкусы" class="inp" style="margin-bottom: 10px;">
                
                <p style="font-size:0.85rem; margin-bottom:8px;">Элементы списка:</p>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="vInp" class="inp" style="margin-bottom:0">
                    <button type="button" onclick="addV()" class="btn-main" style="width:55px;">+</button>
                </div>
                <div id="adminVList" style="margin-top:12px; display:flex; flex-wrap:wrap; gap:8px;"></div>
            </div>

            <input type="file" id="fInp" class="inp">
            <input type="hidden" id="pImg">
            <button type="submit" class="btn-main">СОХРАНИТЬ ТОВАР</button>
        </form>
    </div>
</div>

<div class="overlay" id="loginOverlay" onclick="closeModal('loginOverlay')">
    <div class="modal" style="max-width:320px;" onclick="event.stopPropagation()">
        <div class="close-modal" onclick="closeModal('loginOverlay')"><i class="fas fa-times"></i></div>
        <h2 style="color:var(--neon-green); margin-bottom:20px; text-align:center;">Админ-панель</h2>
        <input type="password" id="pass" class="inp" placeholder="Введите пароль">
        <button onclick="tryLogin()" class="btn-main">ВОЙТИ</button>
    </div>
</div>

<script>
    // Создание фоновых кругов
    const bg = document.getElementById('bgAnim');
    for(let i=0; i<8; i++) {
        const c = document.createElement('div');
        c.className = 'circle';
        const size = Math.random() * 300 + 200;
        c.style.width = size + 'px';
        c.style.height = size + 'px';
        c.style.left = Math.random() * 100 + '%';
        c.style.top = Math.random() * 100 + '%';
        c.style.animationDuration = (Math.random() * 10 + 15) + 's';
        c.style.animationDelay = (Math.random() * 5) + 's';
        bg.appendChild(c);
    }

    const firebaseConfig = {
        apiKey: "AIzaSyD3wDw2ZTTXn2gY467grDOVi9E5vcusilc",
        authDomain: "alexsmok-1dc1c.firebaseapp.com",
        databaseURL: "https://alexsmok-1dc1c-default-rtdb.firebaseio.com",
        projectId: "alexsmok-1dc1c",
        appId: "1:173792761960:web:5bc84d324322edd58ac3dd"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let products = [];
    let curVariants = [];
    let isAdmin = false;
    let curCat = 'all';

    function load() {
        db.ref('products').on('value', snap => {
            const val = snap.val();
            products = val ? Object.keys(val).map(k => ({id:k, ...val[k]})) : [];
            render();
        });
    }

    function render() {
        const cats = ['all', ...new Set(products.map(p => p.category))];
        document.getElementById('cats').innerHTML = cats.map(c => `
            <div class="cat-link ${curCat === c ? 'active' : ''}" onclick="setCat('${c}')">
                ${c === 'all' ? 'Все товары' : c}
            </div>
        `).join('');

        const filtered = curCat === 'all' ? products : products.filter(p => p.category === curCat);
        document.getElementById('productGrid').innerHTML = filtered.map(p => {
            const imgSource = p.imageData.startsWith('data:image') ? p.imageData : `data:image/jpeg;base64,${p.imageData}`;
            return `
                <div class="card">
                    ${isAdmin ? `
                        <div style="position:absolute; top:12px; right:12px; z-index:10; display:flex; gap:8px;">
                            <button onclick="editP('${p.id}')" style="background:var(--neon-green); color:#000; border:none; width:34px; height:34px; border-radius:50%; cursor:pointer;"><i class="fas fa-edit"></i></button>
                            <button onclick="delP('${p.id}')" style="background:#ff4444; color:#fff; border:none; width:34px; height:34px; border-radius:50%; cursor:pointer;"><i class="fas fa-trash"></i></button>
                        </div>
                    ` : ''}
                    <img src="${imgSource}" class="card-img" onerror="this.src='https://via.placeholder.com/400x400/111/2bff00?text=No+Image'">
                    <div class="card-info">
                        <h3 style="font-size:1rem; margin-bottom:8px;">${p.name}</h3>
                        <div class="card-price">${p.price} ₽</div>
                        ${p.variants && p.variants.length > 0 ? 
                            `<button class="btn-variants" onclick="openV('${p.id}')">${p.variantButtonName || 'Вкусы'} (${p.variants.length})</button>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    window.openModal = (id) => {
        const el = document.getElementById(id);
        el.style.display = 'flex';
        setTimeout(() => el.classList.add('active'), 10);
    };

    window.closeModal = (id) => {
        const el = document.getElementById(id);
        el.classList.remove('active');
        setTimeout(() => el.style.display = 'none', 300);
    };

    window.setCat = (c) => { curCat = c; render(); };

    window.openV = (id) => {
        const p = products.find(x => x.id === id);
        document.getElementById('vTitle').textContent = p.variantButtonName || 'Вкусы';
        document.getElementById('vList').innerHTML = p.variants.map(v => `<div class="v-item">${v}</div>`).join('');
        openModal('vOverlay');
    };

    window.addV = () => {
        const v = document.getElementById('vInp').value.trim();
        if(v) { curVariants.push(v); document.getElementById('vInp').value = ''; renderAV(); }
    };

    function renderAV() {
        document.getElementById('adminVList').innerHTML = curVariants.map((v, i) => `
            <span style="background:#222; padding:6px 14px; border-radius:10px; font-size:0.85rem; border:1px solid #333;">
                ${v} <i class="fas fa-times" onclick="curVariants.splice(${i},1);renderAV()" style="color:#ff4444; cursor:pointer; margin-left:10px"></i>
            </span>
        `).join('');
    }

    document.getElementById('pForm').onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('pId').value;
        const data = {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            category: document.getElementById('pCat').value,
            variantButtonName: document.getElementById('pBtnName').value || 'Вкусы',
            variants: curVariants,
            imageData: document.getElementById('pImg').value,
            updatedAt: Date.now()
        };
        if(!data.imageData) return alert('Фото обязательно!');
        id ? await db.ref('products/'+id).update(data) : await db.ref('products').push(data);
        closeModal('pOverlay');
    };

    document.getElementById('fInp').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => document.getElementById('pImg').value = ev.target.result;
        reader.readAsDataURL(e.target.files[0]);
    };

    window.editP = (id) => {
        const p = products.find(x => x.id === id);
        document.getElementById('pId').value = p.id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pCat').value = p.category;
        document.getElementById('pBtnName').value = p.variantButtonName || '';
        document.getElementById('pImg').value = p.imageData;
        curVariants = p.variants ? [...p.variants] : [];
        renderAV();
        openModal('pOverlay');
    };

    window.delP = (id) => { if(confirm('Удалить товар?')) db.ref('products/'+id).remove(); };

    window.tryLogin = () => {
        if(document.getElementById('pass').value === 'smkn00') {
            isAdmin = true; closeModal('loginOverlay');
            document.getElementById('adminArea').style.display = 'block'; render();
        } else alert('Ошибка!');
    };

    window.openAdd = () => {
        document.getElementById('pForm').reset();
        document.getElementById('pId').value = '';
        document.getElementById('pImg').value = '';
        curVariants = []; renderAV();
        openModal('pOverlay');
    };

    load();
</script>
</body>
</html>
