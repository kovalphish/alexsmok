<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Прайс | Smokin174</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        :root {
            --bg-black: #000000;
            --neon-green: #2bff00;
            --transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(ellipse at bottom, #0a1a0a 0%, #000 70%); color: #fff; overflow-x: hidden; letter-spacing: -0.5px; min-height: 100vh; }
        
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: transparent;
        }
        .liquidChrome-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            overflow: hidden; pointer-events: none; opacity: 0.5;
        }
        .liquidChrome-container canvas {
            display: block; width: 100%; height: 100%;
        }
        
        .glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        header { 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            padding: 4px 0;
            background: transparent;
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; padding: 8px 16px; }
        .header-pill {
            max-width: 1400px;
            margin: 0 auto;
            padding: 8px 12px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.14);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
        }
        .logo-text { font-weight: 900; font-size: 1.3rem; text-transform: uppercase; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .btn-channel { background: #fff; color: #000; padding: 8px 18px; border-radius: 50px; font-weight: 900; font-size: 0.75rem; text-decoration: none; text-transform: uppercase; transition: 0.3s; }
        .btn-channel:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .admin-icon { opacity: 0.3; cursor: pointer; transition: 0.3s; color: #fff; }
        .admin-icon.active { opacity: 1; color: var(--neon-green); filter: drop-shadow(0 0 8px var(--neon-green)); }
        
        .cat-bar { padding: 15px 0; overflow-x: auto; scrollbar-width: none; position: relative; z-index: 10; }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-container { display: flex; gap: 12px; padding: 0 20px; max-width: 1400px; margin: 0 auto; }
        .cat-link { 
            padding: 10px 22px; border-radius: 50px; font-weight: 900; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; transition: var(--transition); white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: #fff;
        }
        .cat-link.active { background: var(--neon-green); color: #000; border-color: var(--neon-green); box-shadow: 0 0 20px rgba(43, 255, 0, 0.4); }
        
        .main { max-width: 1400px; margin: 0 auto; padding: 0 15px 40px; position: relative; z-index: 5; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); } }
        
        .card { border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; opacity: 0; transform: translateY(20px); animation: appear 0.6s forwards; transition: transform 0.3s; position: relative; }
        @keyframes appear { to { opacity: 1; transform: translateY(0); } }
        .card:hover { transform: translateY(-5px); }
        .card-img-wrapper { width: 100%; height: 140px; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .badge-new { position: absolute; top: 8px; left: 8px; background: #ff3b30; color: #fff; padding: 3px 10px; border-radius: 8px; font-weight: 900; font-size: 0.6rem; text-transform: uppercase; z-index: 10; }
        .card-img { width: 100%; height: 100%; object-fit: cover; background: #111; transition: 0.5s; }
        .card:hover .card-img { transform: scale(1.1); }
        .card-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-name { font-weight: 900; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 8px; min-height: 2.2em; line-height: 1.2; }
        .card-price { font-weight: 900; font-size: 1.2rem; color: var(--neon-green); text-shadow: 0 0 10px rgba(43,255,0,0.3); }
        
        /* Stock indicator instead of cart button */
        .stock-indicator { padding: 10px; border-radius: 50px; font-weight: 900; font-size: 0.75rem; text-align: center; margin-top: 10px; text-transform: uppercase; }
        .stock-available { background: var(--neon-green); color: #000; }
        .stock-unavailable { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); }
        
        /* Stock button styles - green block with black text, gray block with white text */
        .stock-btn { padding: 12px; border-radius: 12px; font-weight: 900; font-size: 0.8rem; text-align: center; margin-top: 10px; text-transform: uppercase; cursor: default; width: 100%; display: block; }
        .stock-btn-available { background: var(--neon-green); color: #000; }
        .stock-btn-unavailable { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }
        
        .btn-variants { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 50px; font-weight: 900; font-size: 0.7rem; cursor: pointer; width: 100%; margin-top: 10px; text-transform: uppercase; transition: 0.3s; }
        .btn-variants:hover { background: #fff; color: #000; }

        /* Status Out of Stock */
        .card.out-of-stock { filter: grayscale(1); opacity: 0.5; }
        .out-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); background: #ff3b30; color: #fff; padding: 5px 15px; font-weight: 900; font-size: 0.7rem; z-index: 10; border-radius: 5px; box-shadow: 0 0 15px rgba(255,0,0,0.5); pointer-events: none; }
        
        /* Loading state */
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .loading-block { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 20px; padding: 60px 20px; min-height: 300px; }
        .loading-block .loading-text { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); }
        .loader { position: relative; width: 64px; height: 64px; flex-shrink: 0; perspective: 800px; }
        .loader .inner { position: absolute; box-sizing: border-box; width: 100%; height: 100%; border-radius: 50%; left: 0; top: 0; }
        .loader .inner.one { animation: rotate-one 1s linear infinite; border-bottom: 3px solid var(--neon-green); }
        .loader .inner.two { animation: rotate-two 1s linear infinite; border-right: 3px solid var(--neon-green); }
        .loader .inner.three { animation: rotate-three 1s linear infinite; border-top: 3px solid var(--neon-green); }
        @keyframes rotate-one { 0% { transform: rotateX(35deg) rotateY(-45deg) rotateZ(0deg); } 100% { transform: rotateX(35deg) rotateY(-45deg) rotateZ(360deg); } }
        @keyframes rotate-two { 0% { transform: rotateX(50deg) rotateY(10deg) rotateZ(0deg); } 100% { transform: rotateX(50deg) rotateY(10deg) rotateZ(360deg); } }
        @keyframes rotate-three { 0% { transform: rotateX(35deg) rotateY(55deg) rotateZ(0deg); } 100% { transform: rotateX(35deg) rotateY(55deg) rotateZ(360deg); } }

        /* Scroll Top */
        #scrollTop { position: fixed; bottom: 30px; right: 25px; width: 50px; height: 50px; background: var(--neon-green); color: #000; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 1000; cursor: pointer; box-shadow: 0 5px 20px rgba(43,255,0,0.4); transition: 0.3s; }
        
        .btn-full { background: var(--neon-green); color: #000; border: none; padding: 18px; border-radius: 50px; width: 100%; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-full:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(43,255,0,0.4); }
        .btn-full:disabled { opacity: 0.5; filter: grayscale(1); }
        .btn-save { max-width: 260px; align-self: center; border-radius: 18px; letter-spacing: 0.08em; margin-top: 24px !important; }
        
        .add-fab { position: fixed; bottom: 30px; right: 30px; width: 70px; height: 70px; background: var(--neon-green); border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 1500; box-shadow: 0 10px 40px rgba(43, 255, 0, 0.5); transition: var(--transition); cursor: pointer; color: #000; }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 2000; opacity: 0; transition: opacity 0.4s; }
        .overlay.active { display: flex; opacity: 1; }
        .modal { border-radius: 40px; padding: 30px; width: 95%; max-width: 500px; transform: scale(0.9); transition: 0.4s; text-align: center; max-height: 90vh; overflow-y: auto; position: relative; }
        .overlay.active .modal { transform: scale(1); }
        .modal-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border: none; border-radius: 50%; background: rgba(255,255,255,0.15); color: #fff; font-size: 1.5rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: 0.2s; z-index: 10; }
        .modal-close:hover { background: rgba(255,255,255,0.25); }

        .fullscreen-modal { width: 100%; height: 100%; max-width: 100% !important; max-height: 100vh !important; border-radius: 0 !important; padding: 20px !important; display: flex; flex-direction: column; background: #000 !important; text-align: left; }
        .photo-uploader { height: 180px; background: rgba(255,255,255,0.03); border: 2px dashed rgba(255,255,255,0.1); border-radius: 25px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
        .admin-product-image .photo-uploader { height: 100%; min-height: 200px; }
        #previewImg { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        
        .admin-product-layout { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; }
        .admin-product-fields { display: flex; flex-direction: column; gap: 0; }
        .admin-product-image { min-height: 200px; height: 200px; overflow: hidden; }
        .admin-flavors-block { border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; background: rgba(0,0,0,0.2); overflow: hidden; }
        .admin-flavors-block .admin-flavors-scroll { max-height: 180px; overflow-y: scroll; padding: 12px; }
        .admin-flavors-block label { padding: 10px 12px 0; }
        .admin-flavors-block .inp { margin: 8px 12px 12px; border-radius: 12px; }
        
        .admin-input-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        .admin-input-card label { display: block; font-size: 0.65rem; text-transform: uppercase; color: var(--neon-green); margin-bottom: 8px; font-weight: 900; }
        .admin-input-card input, .admin-input-card select { width: 100%; background: transparent; border: none; color: #fff; font-size: 1rem; font-weight: 600; outline: none; }
        .admin-input-card select option { background: #111; color: #fff; }
        .admin-checkbox-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .admin-checkbox-row label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .admin-checkbox-row input[type="checkbox"] { width: 20px; height: 20px; }
        
        /* Flavor tag with checkbox for availability */
        .flavor-tag { display: inline-flex; align-items: center; gap: 8px; padding: 8px 15px; border-radius: 12px; font-weight: 900; font-size: 0.8rem; margin-right: 8px; margin-bottom: 8px; }
        .flavor-tag.available { background: var(--neon-green); color: #000; }
        .flavor-tag.unavailable { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
        .flavor-tag .flavor-check { cursor: pointer; width: 18px; height: 18px; }
        
        .inp { width: 100%; padding: 18px; border-radius: 20px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; margin-bottom: 12px; outline: none; }
        .admin-btns { position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; gap: 6px; }
        .btn-mini { width: 32px; height: 32px; border-radius: 999px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.8rem; padding: 0; }
        .btn-mini-edit { background: rgba(43,255,0,0.18); color: var(--neon-green); box-shadow: 0 0 8px rgba(43,255,0,0.4); }
        .btn-mini-edit:hover { background: rgba(43,255,0,0.3); }
        .btn-mini-del { background: rgba(255,59,48,0.25); color: #fff; }
        .btn-mini-del:hover { background: rgba(255,59,48,0.4); }
        
        .flavor-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 15px; margin-bottom: 10px; }
        .flavor-name { font-weight: 900; text-align: left; flex-grow: 1; font-size: 0.9rem; line-height: 1.2; margin-right: 10px; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }
        * { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.2) transparent; }

        @media (max-width: 600px) {
            .modal { width: 95%; padding: 20px 15px; }
            .flavor-row { padding: 12px 10px; }
            .flavor-name { font-size: 0.85rem; }
        }

        @media (min-width: 768px) {
            .admin-product-layout { grid-template-columns: 1fr 280px; align-items: start; }
            .admin-product-image { height: 280px; min-height: 280px; }
            .admin-product-image .photo-uploader { height: 100%; min-height: 0; }
            .admin-flavors-block .admin-flavors-scroll { max-height: 220px; }
        }
        @media (min-width: 900px) {
            .overlay#adminOverlay { align-items: center; justify-content: center; }
            .fullscreen-modal { width: 900px; height: auto; max-width: 900px !important; max-height: 90vh !important; border-radius: 32px !important; padding: 24px 28px !important; box-shadow: 0 24px 80px rgba(0,0,0,0.7); overflow-y: auto; scrollbar-width: none; }
            .fullscreen-modal::-webkit-scrollbar { width: 0; height: 0; }
            #pForm { height: auto; max-height: none; overflow-y: visible; }
            .admin-product-layout { grid-template-columns: 1fr 320px; }
            .admin-product-image { height: 320px; min-height: 320px; }
            .admin-flavors-block .admin-flavors-scroll { max-height: 260px; }
        }
    </style>
</head>
<body>
<div class="liquidChrome-container" id="liquidChrome"></div>
<canvas id="bg-canvas"></canvas>

<div id="scrollTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
    <i class="fas fa-chevron-up"></i>
</div>

<header>
    <div class="header-pill">
    <div class="header-content">
        <div class="logo-text">ПРАЙС</div>
        <div class="nav-right">
            <a href="https://t.me/smokin174" target="_blank" class="btn-channel">КАНАЛ</a>
            <i class="fas fa-fingerprint fa-2xl admin-icon" id="adminLock" onclick="handleAdminClick()"></i>
        </div>
    </div>
    </div>
</header>

<div class="cat-bar"><div class="cat-container" id="cats"></div></div>

<main class="main">
    <div class="grid" id="productGrid"></div>
</main>

<div class="overlay" id="vOverlay" onclick="closeModal('vOverlay')">
    <div class="modal glass" onclick="event.stopPropagation()">
        <button type="button" class="modal-close" onclick="closeModal('vOverlay')" aria-label="Закрыть">×</button>
        <h2 id="vTitle" style="margin-bottom:25px; font-weight:900;">ВКУСЫ</h2>
        <div id="vList" style="max-height:50vh; overflow-y:auto;"></div>
    </div>
</div>

<div class="overlay" id="loginOverlay" onclick="closeModal('loginOverlay')">
    <div class="modal glass" onclick="event.stopPropagation()">
        <button type="button" class="modal-close" onclick="closeModal('loginOverlay')" aria-label="Закрыть">×</button>
        <h2 style="margin-bottom:20px; font-weight:900;">АДМИН</h2>
        <input type="password" id="pass" class="inp" style="text-align:center;" placeholder="ПАРОЛЬ">

</div>

<div class="overlay" id="adminMenuOverlay" onclick="closeModal('adminMenuOverlay')">

    </div>
</div>

<div class="add-fab" id="addFab" onclick="openAddModal()">
    <i class="fas fa-plus fa-xl"></i>
</div>

<div class="overlay" id="adminOverlay" onclick="closeModal('adminOverlay')">
    <div class="modal glass fullscreen-modal" onclick="event.stopPropagation()">
        <button type="button" class="modal-close" onclick="closeModal('adminOverlay')" aria-label="Закрыть">×</button>
        <form id="pForm" style="display:flex; flex-direction:column; height:100%;">
            <input type="hidden" id="pId"><input type="hidden" id="pImg">
            <div class="admin-product-layout">
                <div class="admin-product-fields">
                    <div class="admin-input-card"><label>Название</label><input type="text" id="pName" required></div>
                    <div class="admin-input-card"><label>Цена</label><input type="number" id="pPrice" required></div>
                    <div class="admin-input-card"><label>Категория</label><input type="text" id="pCat" required></div>
                    <div class="admin-input-card"><label>Текст кнопки</label><input type="text" id="pBtnName"></div>
                    <div class="admin-input-card">
                        <label>Статусы</label>
                        <div class="admin-checkbox-row">
                            <label><input type="checkbox" id="pInStock" style="width:20px; height:20px;" checked> В НАЛИЧИИ</label>
                            <label><input type="checkbox" id="pIsNew" style="width:20px; height:20px;"> НОВОЕ</label>
                        </div>
                    </div>

                </div>

            <button type="submit" class="btn-full btn-save">СОХРАНИТЬ</button>

</div>

<script>
    const tg = window.Telegram?.WebApp || {
        ready: function(){}, expand: function(){}, 
        enableClosingConfirmation: function(){},
        showConfirm: function(m, c){ if(confirm(m)) c(true); },
        openTelegramLink: function(u){ window.open(u, '_blank'); },
        HapticFeedback: { impactOccurred: function(){}, notificationOccurred: function(){} },
        onEvent: function(){}
    };
    try { 
        tg.ready(); 
        tg.expand(); 
        if(tg.enableClosingConfirmation) tg.enableClosingConfirmation(); 
    } catch (e) { console.error(e); }

    const firebaseConfig = {
        apiKey: "AIzaSyD3wDw2ZTTXn2gY467grDOVi9E5vcusilc",
        authDomain: "alexsmok-1dc1c.firebaseapp.com",
        databaseURL: "https://alexsmok-1dc1c-default-rtdb.firebaseio.com",
        projectId: "alexsmok-1dc1c",
        appId: "1:173792761960:web:5bc84d324322edd58ac3dd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    const user = tg.initDataUnsafe?.user || { id: "test", username: "guest" };

    let products = [], curCat = 'all', isAdmin = false, tempVariants = [];

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    class Particle {
        constructor() { this.reset(); }
        reset() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.size = Math.random()*2; this.speedY = Math.random()*0.5 + 0.1; this.alpha = Math.random()*0.5; }
        update() { this.y -= this.speedY; if (this.y < -10) this.reset(); }
        draw() { ctx.fillStyle = `rgba(43, 255, 0, ${this.alpha})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); }
    }
    function initParticles() { 
        const isLowPower = window.innerWidth < 500 || navigator.hardwareConcurrency === 2;
        const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const count = prefersReduced ? 0 : (isLowPower ? 14 : 28);
        particles = [];
        for (let i = 0; i < count; i++) particles.push(new Particle());
    }
    let animId;
    let lastFrameTs = 0;
    function animate() { 
        if (document.hidden) return;
        const now = performance.now();
        const isLowPower = window.innerWidth < 500 || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
        const minDelta = isLowPower ? 1000 / 30 : 1000 / 60;
        if (now - lastFrameTs < minDelta) {
            animId = requestAnimationFrame(animate);
            return;
        }
        lastFrameTs = now;
        ctx.clearRect(0,0,canvas.width,canvas.height); 
        particles.forEach(p=>{p.update();p.draw();}); 
        animId = requestAnimationFrame(animate); 
    }
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !animId) {
            animate();
        } else if (document.hidden && animId) {
            cancelAnimationFrame(animId);
            animId = null;
        }
    });
    window.addEventListener('resize', () => { resize(); initParticles(); });
    resize(); initParticles(); animate();

    window.onscroll = () => { document.getElementById('scrollTop').style.display = window.scrollY > 300 ? 'flex' : 'none'; };

    function showLoadingState() {
        document.getElementById('productGrid').innerHTML = `
            <div class="loading-block" style="grid-column: 1 / -1;">
                <div class="loader">
                    <div class="inner one"></div>
                    <div class="inner two"></div>
                    <div class="inner three"></div>
                </div>
                <div class="loading-text">Товары подгружаются</div>
            </div>`;
    }

    function load() {
        showLoadingState();
        db.ref('products').on('value', snap => {
            const val = snap.val();
            products = val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : [];
            render();
        });
    }

    function render() {
        // Собираем категории, сохраняя порядок появления в products
        const catsSet = new Set();
        products.forEach(p => { if (p.category) catsSet.add(p.category); });
        const cats = ['all', ...catsSet];
        document.getElementById('cats').innerHTML = cats.map(c => `<div class="cat-link glass ${curCat === c ? 'active' : ''}" onclick="curCat='${c}';render()">${c === 'all' ? 'ВСЁ' : c}</div>`).join('');
        
        // Сортировка: новые товары в начало, товары без наличия в конец списка
        let filtered = curCat === 'all' ? products : products.filter(p => p.category === curCat);
        filtered.sort((a, b) => {
            const aNew = a.isNew === true;
            const bNew = b.isNew === true;
            const aOut = a.inStock === false;
            const bOut = b.inStock === false;
            
            // Сначала новые, потом обычные, потом без наличия
            if (aNew && !bNew) return -1;
            if (!aNew && bNew) return 1;
            if (aOut && !bOut) return 1;
            if (!aOut && bOut) return -1;
            return 0;
        });
        
        document.getElementById('productGrid').innerHTML = filtered.map((p, index) => {
            const isOut = p.inStock === false;
            const fitStyle = p.fit || 'cover';
            const hasVariants = p.variants && p.variants.length > 0;
            
            // Определяем доступные вкусы (если есть варианты)
            let availableFlavors = [];
            if (hasVariants) {
                availableFlavors = p.variants.filter(v => {
                    // Если flavorAvailability не задан, считаем все доступными
                    if (!p.flavorAvailability) return true;
                    return p.flavorAvailability[v] !== false;
                });
            }
            
            // Если есть доступные вкусы или нет вариантов - товар считается доступным
            const hasAvailable = !hasVariants ? !isOut : availableFlavors.length > 0;
            
            return `
            <div class="card glass ${isOut ? 'out-of-stock' : ''}" style="animation-delay: ${index * 0.05}s">
                ${isAdmin ? `<div class="admin-btns">
                    <button class="btn-mini btn-mini-edit" onclick="editProduct('${p.id}')"><i class="fas fa-pen"></i></button>
                    <button class="btn-mini btn-mini-del" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
                </div>` : ''}
                ${isOut ? '<div class="out-label">НЕТ В НАЛИЧИИ</div>' : ''}
                ${!isOut && p.isNew ? '<div class="badge-new">NEW</div>' : ''}
                <div class="card-img-wrapper"><img src="${p.imageData || ''}" class="card-img" style="object-fit: ${fitStyle};"></div>
                <div class="card-info">
                    <div class="card-name">${p.name}</div>
                    <div class="card-price">${p.price} ₽</div>
                    ${hasVariants ? 
                        `<button class="btn-variants" ${!hasAvailable?'disabled style="opacity:0.5;"':''} onclick="showFlavors('${p.id}')">${p.variantButtonName || 'ВКУСЫ'}</button>` : 
                        `<div class="stock-btn ${hasAvailable ? 'stock-btn-available' : 'stock-btn-unavailable'}">${hasAvailable ? 'В НАЛИЧИИ' : 'НЕТ В НАЛИЧИИ'}</div>`
                    }
                </div>
            </div>`}).join('');
        document.getElementById('addFab').style.display = isAdmin ? 'flex' : 'none';
    }

    window.showFlavors = (id) => {
        const p = products.find(x => x.id === id);
        document.getElementById('vTitle').innerText = p.variantButtonName || 'ВКУСЫ';
        
        const flavorAvailability = p.flavorAvailability || {};
        // Сортировка: недоступные вкусы в конец списка
        const sortedVariants = (p.variants || []).sort((a, b) => {
            const aAvail = flavorAvailability[a] !== false;
            const bAvail = flavorAvailability[b] !== false;
            if (aAvail && !bAvail) return -1;
            if (!aAvail && bAvail) return 1;
            return 0;
        });
        
        document.getElementById('vList').innerHTML = sortedVariants.map(v => {
            const isAvailable = flavorAvailability[v] !== false;
            return `
            <div class="flavor-row">
                <div class="flavor-name">${v}</div>
                <div class="stock-btn ${isAvailable ? 'stock-btn-available' : 'stock-btn-unavailable'}" style="padding: 8px 14px; font-size: 0.7rem; width: auto; flex-shrink: 0;">${isAvailable ? 'В НАЛИЧИИ' : 'НЕТ В НАЛИЧИИ'}</div>
            </div>`;
        }).join('');
        openModal('vOverlay');
    };

    window.handleAdminClick = () => isAdmin ? openModal('adminMenuOverlay') : openModal('loginOverlay');
    window.tryLogin = () => {
        const v = document.getElementById('pass').value;
        if (v === 'smkn00') {
            isAdmin = true;
            render();
            closeModal('loginOverlay');
            document.getElementById('adminLock').classList.add('active');
        }
    };
    window.logoutAdmin = () => { isAdmin=false; location.reload(); };

    window.openAddModal = () => {
        document.getElementById('pId').value = ''; document.getElementById('pForm').reset();
        document.getElementById('pInStock').checked = true;
        document.getElementById('pIsNew').checked = false;
        document.getElementById('pFit').value = 'cover';
        document.getElementById('previewImg').style.display = 'none';
        tempVariants = []; renderV(); openModal('adminOverlay');
    };

    window.editProduct = (id) => {
        const p = products.find(x => x.id === id);
        document.getElementById('pId').value = p.id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pCat').value = p.category;
        document.getElementById('pBtnName').value = p.variantButtonName || '';
        document.getElementById('pInStock').checked = p.inStock !== false;
        document.getElementById('pIsNew').checked = p.isNew === true;
        document.getElementById('pFit').value = p.fit || 'cover';
        document.getElementById('pImg').value = p.imageData || '';
        if(p.imageData) { document.getElementById('previewImg').src = p.imageData; document.getElementById('previewImg').style.display='block'; }
        // Копируем варианты с их доступностью
        tempVariants = (p.variants || []).map(v => {
            const availability = p.flavorAvailability || {};
            return { name: v, available: availability[v] !== false };
        });
        renderV(); openModal('adminOverlay');
    };

    window.deleteProduct = (id) => {
        tg.showConfirm('Удалить этот товар?', (ok) => { if(ok) db.ref('products/'+id).remove(); });
    };

    function addV(v) { if(!v)return; tempVariants.push({ name: v, available: true }); renderV(); }
    function removeV(idx) { tempVariants.splice(idx, 1); renderV(); }
    function toggleVAvailability(idx) { tempVariants[idx].available = !tempVariants[idx].available; renderV(); }
    
    function renderV() { 
        document.getElementById('adminVList').innerHTML = tempVariants.map((v, i) => 
            `<div class="flavor-tag ${v.available ? 'available' : 'unavailable'}">
                <input type="checkbox" class="flavor-check" ${v.available ? 'checked' : ''} onchange="toggleVAvailability(${i})">
                ${v.name}
                <i class="fas fa-times" onclick="removeV(${i})" style="cursor:pointer;margin-left:4px;"></i>
            </div>`
        ).join(''); 
    }

    document.getElementById('fInp').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = () => { document.getElementById('pImg').value = reader.result; document.getElementById('previewImg').src = reader.result; document.getElementById('previewImg').style.display = 'block'; };
        reader.readAsDataURL(e.target.files[0]);
    };

    document.getElementById('pForm').onsubmit = (e) => {
        e.preventDefault();
        const id = document.getElementById('pId').value;
        
        // Создаём объект доступности вкусов
        const flavorAvailability = {};
        tempVariants.forEach(v => {
            flavorAvailability[v.name] = v.available;
        });
        
        const data = {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            category: document.getElementById('pCat').value,
            variantButtonName: document.getElementById('pBtnName').value,
            inStock: document.getElementById('pInStock').checked,
            isNew: document.getElementById('pIsNew').checked,
            fit: document.getElementById('pFit').value,
            imageData: document.getElementById('pImg').value,
            variants: tempVariants.map(v => v.name),
            flavorAvailability: flavorAvailability
        };
        id ? db.ref('products/'+id).update(data) : db.ref('products').push(data);
        closeModal('adminOverlay');
    };

    window.openModal = (id) => { document.getElementById(id).style.display = 'flex'; setTimeout(() => document.getElementById(id).classList.add('active'), 10); };
    window.closeModal = (id) => { document.getElementById(id).classList.remove('active'); setTimeout(() => document.getElementById(id).style.display = 'none', 400); };

    load();

    (function initLiquidChrome() {
        var container = document.getElementById('liquidChrome');
        if (!container) return;
        var canvas = document.createElement('canvas');
        var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) return;
        container.appendChild(canvas);

        var baseColor = [0.015, 0.06, 0.01];
        var speed = 0.4;
        var amplitude = 0.35;
        var freqX = 2.5;
        var freqY = 2.5;

        var vs = 'attribute vec2 position;attribute vec2 uv;varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,0.,1.);}';
        var fs = 'precision highp float;uniform float uTime;uniform vec3 uResolution;uniform vec3 uBaseColor;uniform float uAmplitude;uniform float uFrequencyX;uniform float uFrequencyY;uniform vec2 uMouse;varying vec2 vUv;' +
            'vec4 renderImage(vec2 uvCoord){vec2 fragCoord=uvCoord*uResolution.xy;vec2 uv=(2.*fragCoord-uResolution.xy)/min(uResolution.x,uResolution.y);' +
            'for(float i=1.;i<10.;i++){uv.x+=uAmplitude/i*cos(i*uFrequencyX*uv.y+uTime+uMouse.x*3.14159);uv.y+=uAmplitude/i*cos(i*uFrequencyY*uv.x+uTime+uMouse.y*3.14159);}' +
            'vec2 diff=uvCoord-uMouse;float dist=length(diff);float falloff=exp(-dist*20.);float ripple=sin(10.*dist-uTime*2.)*0.03;uv+=(diff/(dist+0.0001))*ripple*falloff;' +
            'vec3 color=uBaseColor/abs(sin(uTime-uv.y-uv.x));return vec4(color,1.);}' +
            'void main(){vec4 col=vec4(0.);int samples=0;for(int i=-1;i<=1;i++)for(int j=-1;j<=1;j++){vec2 offset=vec2(float(i),float(j))*(1./min(uResolution.x,uResolution.y));col+=renderImage(vUv+offset);samples++;}gl_FragColor=col/float(samples);}';

        var vsh = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vsh, vs);
        gl.compileShader(vsh);
        var fsh = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fsh, fs);
        gl.compileShader(fsh);
        var prog = gl.createProgram();
        gl.attachShader(prog, vsh);
        gl.attachShader(prog, fsh);
        gl.linkProgram(prog);
        gl.useProgram(prog);

        var posLoc = gl.getAttribLocation(prog, 'position');
        var uvLoc = gl.getAttribLocation(prog, 'uv');
        var buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,0,0, 3,-1,2,0, -1,3,0,2]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 16, 0);
        gl.enableVertexAttribArray(uvLoc);
        gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 16, 8);

        var uTime = gl.getUniformLocation(prog, 'uTime');
        var uResolution = gl.getUniformLocation(prog, 'uResolution');
        var uBaseColor = gl.getUniformLocation(prog, 'uBaseColor');
        var uAmplitude = gl.getUniformLocation(prog, 'uAmplitude');
        var uFrequencyX = gl.getUniformLocation(prog, 'uFrequencyX');
        var uFrequencyY = gl.getUniformLocation(prog, 'uFrequencyY');
        var uMouse = gl.getUniformLocation(prog, 'uMouse');
        var mouse = [0.5, 0.5];

        gl.clearColor(0.02, 0.05, 0.01, 1);

        function resize() {
            var w = container.offsetWidth, h = container.offsetHeight;
            canvas.width = w;
            canvas.height = h;
            gl.viewport(0, 0, w, h);
        }
        window.addEventListener('resize', resize);
        resize();

        var animId;
        function render(t) {
            animId = requestAnimationFrame(render);
            gl.uniform1f(uTime, t * 0.001 * speed);
            gl.uniform3f(uResolution, canvas.width, canvas.height, canvas.width / canvas.height);
            gl.uniform3fv(uBaseColor, baseColor);
            gl.uniform1f(uAmplitude, amplitude);
            gl.uniform1f(uFrequencyX, freqX);
            gl.uniform1f(uFrequencyY, freqY);
            gl.uniform2fv(uMouse, mouse);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        animId = requestAnimationFrame(render);
    })();
</script>
